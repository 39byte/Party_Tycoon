# v*.*.* 태그를 push하면 테스트 → 윈도우 exe 빌드 → GitHub 릴리스 생성·업로드
name: release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test.js
      - name: build
        working-directory: desktop
        run: |
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm run dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/dist/*.exe \
            --title "정당 키우기 ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md --generate-notes --verify-tag
