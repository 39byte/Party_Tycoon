<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정당 키우기</title>
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface2:#F1F5F9; --fg:#0F172A; --muted:#475569; --border:#E2E8F0;
  --primary:#0F172A; --on-primary:#FFFFFF; --accent:#0369A1; --warn:#B45309; --danger:#DC2626; --ok:#15803D;
  --ring:#0369A1; --party:#EA580C; --shadow:0 1px 2px rgba(15,23,42,.06);
  --r:10px; --font:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1220; --surface:#111A2E; --surface2:#17223B; --fg:#E2E8F0; --muted:#A3B1C6; --border:#26324D;
  --primary:#E2E8F0; --on-primary:#0B1220; --accent:#38BDF8; --warn:#FBBF24; --danger:#F87171; --ok:#4ADE80;
  --ring:#38BDF8; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:16px;font-weight:700;margin-bottom:10px}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.ok{color:var(--ok)} .bad{color:var(--danger)} .warn{color:var(--warn)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;min-width:0}
.chip{width:14px;height:14px;border-radius:4px;background:var(--party);flex:none}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;flex:1}
.stat{display:flex;flex-direction:column;line-height:1.2}
.stat b{font-size:15px}
.stat span{font-size:12px;color:var(--muted)}
.ctrls{display:flex;gap:4px;align-items:center}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:36px;height:36px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer}
.ib:hover{background:var(--surface2)}
.ib[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* layout */
.app{display:grid;grid-template-columns:190px 1fr;min-height:calc(100dvh - 58px)}
nav{border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;font-weight:500}
nav button:hover{background:var(--surface2)}
nav button[aria-current="page"]{background:var(--surface2);font-weight:700;box-shadow:inset 3px 0 0 var(--party)}
nav .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
main{padding:16px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.span-2{grid-column:span 2} .span-3{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--border);padding:6px}
  nav button{flex:1 1 23%;justify-content:center;padding:8px 4px;font-size:13px}
  nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--party)}
  .grid{grid-template-columns:1fr} .span-2{grid-column:auto}
}
@media (max-width:600px){
  .stats{order:3;flex-basis:100%;gap:4px 14px}
  .brand{flex:1}
  .tile{padding:6px;min-height:76px}
  .tile .tag{position:static;align-self:flex-start;font-size:10px}
  .tile .small{font-size:11.5px}
  main{padding:10px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;transition:background .15s}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.pri:hover:not(:disabled){opacity:.9;background:var(--primary)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* actions */
.acts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.act{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.act .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.act .why{font-size:12.5px;color:var(--warn);min-height:1em}
.act p{margin:0;font-size:13px;color:var(--muted)}

/* progress */
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--party)}
.seatbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.seatbar>i{display:block;height:100%}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}}
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mapwrap>*{min-width:0}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;min-height:84px}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{outline:3px solid var(--party);outline-offset:-1px}
.tile b{font-size:15px}
.tile .small{line-height:1.3}
.tile .tag{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--party);color:#fff}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
.tblwrap{overflow-x:auto}
input[type=number],select,input[type=text]{min-height:34px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
input[type=number]{width:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
label.f>span.h{font-weight:400;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

/* list/log */
.log{list-style:none;margin:0;padding:0}
.log li{padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;display:flex;gap:10px}
.log li time{color:var(--muted);font-size:12.5px;white-space:nowrap;padding-top:1px}
.log li.bad{color:var(--danger)} .log li.ok{color:var(--ok)}
.law{border-left:3px solid var(--party);padding:2px 0 2px 12px;margin:0 0 12px}
.law b{display:block}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--muted);font-size:14px;padding:16px 0;text-align:center}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.check .st{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800}
.check .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.check .st.bad{background:var(--danger);border-color:var(--danger);color:#fff}
.check li>.btn{margin-left:auto;min-height:32px;padding:4px 12px;flex:none}
.guide details{border-bottom:1px solid var(--border);padding:10px 0}
.guide summary{cursor:pointer;font-weight:700;padding:4px 0}
.guide details>:not(summary){font-size:14px;margin:8px 0 0}
.guide details ul{padding-left:20px}
.guide details li{margin:3px 0}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--fg);border-radius:14px;max-width:560px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal h2{font-size:19px;margin-bottom:12px}
.modal .lawnote{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 10px;margin:10px 0}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choices .btn{justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;font-weight:600}
.choices .btn small{font-weight:400;color:var(--muted)}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .2s ease-out}
.toast.bad{background:var(--danger);color:#fff} .toast.ok{background:var(--ok);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:34px;height:34px;border-radius:8px;border:3px solid transparent}
.swatches input:checked+span{border-color:var(--fg)}
.swatches input:focus-visible+span{outline:3px solid var(--ring);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<header class="top" id="top"></header>
<div class="app">
  <nav id="nav" aria-label="메뉴"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="logic.js"></script>
<script>
'use strict';
const { REGIONS: R, LAW } = L;
const RK = Object.fromEntries(R.map(r => [r.k, r]));
const SCHED = L.schedule(40);
const SAVE_KEY = 'party-tycoon-save-v1', SET_KEY = 'party-tycoon-settings';
const RIV = {
  A: { name: '한결당', color: '#D03A3A', ideo: -1, base: 35 },
  B: { name: '새길당', color: '#2563EB', ideo: 1, base: 37 },
  C: { name: '푸른내일당', color: '#CA8A04', ideo: 0.5, base: 6 },
  O: { name: '기타·무소속', color: '#94A3B8', ideo: 0, base: 3 },
};
const PCOLORS = [['주황', '#EA580C'], ['보라', '#7C3AED'], ['청록', '#0D9488'], ['초록', '#16A34A'], ['분홍', '#DB2777'], ['갈색', '#92400E']];
const IDEO = { '-1': '보수', '0': '중도', '1': '진보' };
const ISSUES = [
  { k: 'econ', n: '경제·일자리', fit: [1.15, 1.1, 1.0] }, { k: 'house', n: '부동산·주거', fit: [1.0, 1.1, 1.05] },
  { k: 'welfare', n: '복지·돌봄', fit: [0.8, 1.0, 1.25] }, { k: 'security', n: '안보·외교', fit: [1.3, 1.0, 0.8] },
  { k: 'climate', n: '기후·환경', fit: [0.8, 1.0, 1.25] }, { k: 'youth', n: '청년·교육', fit: [1.0, 1.15, 1.1] },
  { k: 'region', n: '지역균형발전', fit: [1.05, 1.1, 1.05] }, { k: 'reform', n: '정치개혁', fit: [0.9, 1.25, 1.05] },
];
const JOBS = [
  { n: '변호사', f: 18, s: 62 }, { n: '대학교수', f: 15, s: 64 }, { n: '시민운동가', f: 12, s: 55 }, { n: '전직 고위공무원', f: 14, s: 63 },
  { n: '기업인', f: 16, s: 58 }, { n: '언론인', f: 22, s: 60 }, { n: '의사', f: 12, s: 57 }, { n: '청년활동가', f: 8, s: 50 },
  { n: '노동운동가', f: 10, s: 54 }, { n: '예비역 장성', f: 14, s: 58 }, { n: '방송인', f: 35, s: 48 }, { n: '전직 지방의원', f: 10, s: 56 },
];
const RECORDS = [
  { t: '음주운전(벌금 500만원)' }, { t: '도로교통법 위반(벌금 50만원)' }, { t: '집시법 위반(벌금 100만원)' },
  { t: '사기(징역형 집행유예, 형 실효)' }, { t: '공직선거법 위반(벌금 150만원, 5년 미경과)', ban: true },
];
const SUR = '김이박최정강조윤장임한오서신권황안송류홍전고문양손배백허유남심노하곽성차주우구민진'.split('');
const GM = '민준 서준 도윤 예준 시우 하준 주원 지호 준서 현우 도현 건우 우진 성민 재원 태현 정훈 상철 영수 동현 병철 성호 종민 진우 승현 민재 기태 용석'.split(' ');
const GF = '서연 서윤 지우 서현 민서 하은 하윤 윤서 지유 지민 수빈 은지 혜진 미영 정희 영희 지현 수진 은정 민정 경희 선영 나연 유진 소연 다은 예린'.split(' ');
const CORPS = ['한빛건설', '대명산업', '태성개발', '동양물산', '세진기공', '신우토건'];
const NAT_SPEND = [{ n: '최소', c: 3e7, b: 0 }, { n: '보통', c: 1e8, b: 0.06 }, { n: '최대', c: 2e8, b: 0.12 }];
const GOV_SPEND = [{ n: '최소', f: 0.1, b: 0 }, { n: '보통', f: 0.35, b: 0.06 }, { n: '최대', f: 1, b: 0.12 }];
const PRES_SPEND = [{ n: '최소', c: 3e9, b: 0 }, { n: '보통', c: 1.5e10, b: 0.05 }, { n: '최대', c: 4e10, b: 0.1 }];
const govLimit = k => 3e8 + RK[k].voters * 4e8; // 시·도지사 선거비용제한액 근사
const TYPE_N = { nat: '국회의원선거', pres: '대통령선거', gov: '지방선거' };

// ---------- utils ----------
const $ = s => document.querySelector(s);
const rnd = Math.random, rr = (a, b) => a + rnd() * (b - a), pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const pct = (x, d = 1) => (x * 100).toFixed(d) + '%';
function won(n) {
  const s = n < 0 ? '-' : '', a = Math.abs(n);
  if (a >= 1e8) return s + (a / 1e8).toFixed(a >= 1e10 ? 0 : a >= 1e9 ? 1 : 2).replace(/\.?0+$/, '') + '억';
  if (a >= 1e4) return s + Math.round(a / 1e4).toLocaleString() + '만';
  return s + Math.round(a) + '원';
}
const WD = '일월화수목금토';
function fdate(d) { const t = L.dayToDate(d); return `${t.getUTCFullYear()}.${String(t.getUTCMonth() + 1).padStart(2, '0')}.${String(t.getUTCDate()).padStart(2, '0')} (${WD[t.getUTCDay()]})`; }
const pn = id => id === 'P' ? S.party.name : RIV[id].name;
const pc = id => id === 'P' ? S.party.color : RIV[id].color;

let S = null, tab = 'home', selReg = 'seoul', modalOpen = false;

// ---------- sound (WebAudio 합성: 파일 없음, 꺼도 게임 진행에 영향 없음) ----------
const Snd = {
  set: (() => { try { return Object.assign({ bgm: false, sfx: false, vol: 0.5 }, JSON.parse(localStorage.getItem(SET_KEY) || '{}')); } catch (e) { return { bgm: false, sfx: false, vol: 0.5 }; } })(),
  ctx: null, out: null, bus: null, timer: null, step: 0, t: 0,
  saveSet() { try { localStorage.setItem(SET_KEY, JSON.stringify(this.set)); } catch (e) { } },
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    this.out = this.ctx.createGain(); this.out.gain.value = this.set.vol; this.out.connect(this.ctx.destination);

  note(dest, f, t, dur, type = 'sine', g = 0.1, atk = 0.01) {

      cash: [[1318, 0, 0.08, 'sine', 0.09], [1760, 0.06, 0.15, 'sine', 0.09]],
      bad: [[220, 0, 0.25, 'square', 0.05], [165, 0.12, 0.3, 'square', 0.05]],
      event: [[523, 0, 0.3, 'triangle', 0.1], [659, 0.1, 0.3, 'triangle', 0.1], [784, 0.2, 0.4, 'triangle', 0.1]],
      win: [[523, 0, 0.25, 'triangle', 0.12], [659, 0.15, 0.25, 'triangle', 0.12], [784, 0.3, 0.25, 'triangle', 0.12], [1046, 0.45, 0.7, 'triangle', 0.14]],
    }[name] || [];

  // C - Am - F - G 잔잔한 루프
  PROG: [[261.63, 329.63, 392], [220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66]],

// ---------- people ----------
function genName(g) { return pick(SUR) + pick(g === 'F' ? GF : GM); }
function genPerson(o = {}) {
  const gender = o.gender || (rnd() < (S && S.up.youth ? 0.5 : 0.36) ? 'F' : 'M');
  const job = pick(JOBS);
  let age = o.age || Math.round(rr(30, 68) - (S && S.up.youth && rnd() < 0.4 ? 10 : 0));

    skill: Math.round(clamp(gauss() * 12 + job.s, 10, 99)), integ, rec: rec.map(r => r.t), ban: rec.some(r => r.ban), role: '',
  };
}
const genericCand = g => { const p = genPerson({ gender: g }); S.nid--; p.id = null; p.fame = Math.round(clamp(p.fame * 0.5, 2, 30)); return p; };
const candFactor = c => clamp(1 + (c.fame - 15) / 200 + (c.skill - 50) / 250 - (c.rec ? c.rec.length : 0) * 0.05, 0.6, 1.6);
const person = id => S.pool.find(p => p.id === +id);
const leader = () => S.pool.find(p => p.leader);

// 중앙당 사무처 운영비: 당원 관리·의원 지원 인력이 규모에 따라 늘어남
const officeCost = () => S.phase === 'prep' ? 5e6 : 1.5e7 + totalMembers() * 800 + seatTotal('P') * 1.5e7;
const seatTotal = id => sum(Object.values(S.seats[id].d)) + S.seats[id].pr;
const totalMembers = () => sum(Object.values(S.members));
const chaptersOk = () => R.filter(r => S.chapters[r.k] && S.members[r.k] >= LAW.chapterMembers).length;
const govCount = id => Object.values(S.gov).filter(x => x === id).length;

function addLog(text, type = '') { S.log.push({ d: S.day, t: text, c: type }); if (S.log.length > 400) S.log.shift(); }
function earn(n, cat) { S.money += n; S.ledger.cur[cat] = (S.ledger.cur[cat] || 0) + n; }
function spend(n, cat) { S.money -= n; S.ledger.cur[cat] = (S.ledger.cur[cat] || 0) - n; }

// ---------- 여론 ----------
const undecided = () => clamp(24 - S.support * 0.3, 8, 30);
function poll() {
  const p = S.support, U = undecided(), rest = Math.max(0, 100 - p - U), w = S.rw, ws = w.A + w.B + w.C + w.O;
  return { P: p, A: rest * w.A / ws, B: rest * w.B / ws, C: rest * w.C / ws, O: rest * w.O / ws, U };
}
function natShares() { const q = poll(), s = q.P + q.A + q.B + q.C + q.O; return { P: q.P / s, A: q.A / s, B: q.B / s, C: q.C / s, O: q.O / s }; }
const snapPoll = () => { const q = poll(); return { d: S.day, P: +q.P.toFixed(1), A: +q.A.toFixed(1), B: +q.B.toFixed(1), C: +q.C.toFixed(1) }; };
function regFactor(k) {
  const r = RK[k], i = S.party.ideo;
  let f = i === 0 ? 1.05 - 0.4 * Math.abs(r.lean) : Math.max(0.3, 1 + 0.7 * i * r.lean);
  f += Math.min(0.5, (S.members[k] || 0) / (r.voters * 1e6) * 250);
  if (S.chapters[k]) f += 0.05;
  if (S.gov[k] === 'P') f += 0.15;
  return f;
}
function pf(id, k) {
  const r = RK[k], g = S.gov[k] === id ? 1.05 : 1;
  if (id === 'A') return Math.max(0.15, 1 - 0.85 * r.lean) * g;
  if (id === 'B') return Math.max(0.15, 1 + 0.85 * r.lean) * g;
  if (id === 'C') return (1 + 0.25 * r.lean) * g;
  if (id === 'O') return 1;
  return regFactor(k);
}
const regSupport = k => S.support * regFactor(k);

// ---------- 선거 시뮬레이션 ----------
// ponytail: 지역 성향×전국 지지율×로그정규 잡음의 단순 모델. 세대·이슈별 유권자 모델은 필요해지면 추가
function shareRace(k, ids, mods) {
  const ns = natShares(), v = {};
  let tot = 0;
  for (const id of ids) {
    let x = ns[id] * pf(id, k) * Math.exp(gauss() * 0.22) * (mods[id] || 1);
    if (id === 'O' && rnd() < 0.03) x *= 6; // 유력 무소속
    v[id] = x; tot += x;
  }
  let win = ids[0];
  for (const id of ids) { v[id] /= tot; if (v[id] > v[win]) win = id; }
  return { v, win };
}
function campBoost(c, k) { return c ? 1 + c.boost.nat + (c.boost.reg[k] || 0) : 1; }

function simGeneral(c) {
  const reg = c && c.reg, seatsD = { P: {}, A: {}, B: {}, C: {}, O: {} }, pDist = [];
  for (const r of R) {
    const mine = reg ? reg.dist[r.k] || [] : [];
    for (let i = 0; i < r.seats; i++) {
      const ids = ['A', 'B']; if (rnd() < 0.35) ids.push('C'); if (rnd() < 0.5) ids.push('O');
      const cand = mine[i], mods = {};
      for (const id of ['A', 'B']) mods[id] = 1 + 0.12 * ((S.seats[id].d[r.k] || 0) / r.seats);
      if (cand) { ids.push('P'); mods.P = candFactor(cand) * campBoost(c, r.k) * (1 + cand.spendB); }
      const { v, win } = shareRace(r.k, ids, mods);
      seatsD[win][r.k] = (seatsD[win][r.k] || 0) + 1;
      if (cand) pDist.push({ k: r.k, name: cand.name, pid: cand.id, share: v.P, win: win === 'P', winner: win, cost: cand.dep + cand.spend });
    }
  }
  const ns = natShares(), raw = {};
  for (const id of ['A', 'B', 'C', 'O']) raw[id] = ns[id] * (id === 'C' ? 1.3 : id === 'O' ? 0.8 : 1) * Math.exp(gauss() * 0.05);
  raw.P = reg && reg.pr.length ? ns.P * 1.15 * campBoost(c, '') * Math.exp(gauss() * 0.05) : 0;
  const rs = sum(Object.values(raw)), pv = {};
  for (const id in raw) pv[id] = raw[id] / rs;
  const dist = id => sum(Object.values(seatsD[id]));
  const pr = L.allocatePR(Object.keys(pv).map(id => ({ id, votes: pv[id] * LAW.voters * 0.67, district: id === 'O' ? 0 : dist(id) })));
  let lostPR = 0;
  if (reg && pr.P > reg.pr.length) { lostPR = pr.P - reg.pr.length; pr.P = reg.pr.length; }
  return { seatsD, pr, pv, pDist, lostPR };
}
function applySeats(g) { for (const id in g.seatsD) S.seats[id] = { d: g.seatsD[id], pr: g.pr[id] || 0 }; }

function simGov(c) {
  const win = {}, mine = [];
  for (const r of R) {
    const ids = ['A', 'B']; if (rnd() < 0.3) ids.push('C'); if (rnd() < 0.3) ids.push('O');
    const cand = c && c.reg && c.reg.gov[r.k], mods = {};
    if (cand) { ids.push('P'); mods.P = candFactor(cand) * campBoost(c, r.k) * (1 + cand.spendB); }
    const res = shareRace(r.k, ids, mods);
    win[r.k] = res.win;
    if (cand) mine.push({ k: r.k, name: cand.name, pid: cand.id, share: res.v.P, win: res.win === 'P', winner: res.win, cost: cand.dep + cand.spend });
  }
  return { win, mine };
}
function simPres(c) {
  const ns = natShares(), ids = ['A', 'B'], v = {};
  if (c.rivals.C && !c.unified) ids.push('C');
  const cand = c.reg && c.reg.cand;
  if (cand) ids.push('P');
  let tot = 0;
  for (const id of ids) {
    const cf = id === 'P' ? candFactor(cand) * campBoost(c, '') * (1 + cand.spendB) : 1 + (c.rivals[id].fame - 50) / 150 + (c.rivals[id].skill - 50) / 250;
    let x = ns[id] * cf * Math.exp(gauss() * 0.07);
    if (id === 'P' && c.unified) x += ns.C * 0.6;
    v[id] = x; tot += x;
  }
  let win = ids[0];
  for (const id of ids) { v[id] /= tot; if (v[id] > v[win]) win = id; }
  return { v, win, ids };
}

// ---------- 선거 일정 ----------
function newCamp(e) {
  const c = { key: e.key, type: e.type, day: e.day, name: e.name, reg: null, boost: { nat: 0, reg: {} }, unified: false };
  if (e.type === 'nat') c.draft = { reg: Object.fromEntries(R.map(r => [r.k, { n: 0, strat: '', spend: 1 }])), prN: 0, prIds: [], women: 30 };
  if (e.type === 'gov') c.draft = { reg: Object.fromEntries(R.map(r => [r.k, { run: false, cand: '', spend: 1 }])), women: 30 };
  if (e.type === 'pres') {
    c.draft = { cand: '', spend: 1 };
    c.rivals = {};
    for (const id of ['A', 'B', 'C']) if (id !== 'C' || rnd() < 0.7)
      c.rivals[id] = { name: genName(rnd() < 0.3 ? 'F' : 'M'), fame: Math.round(rr(id === 'C' ? 35 : 55, id === 'C' ? 60 : 85)), skill: Math.round(rr(50, 85)) };
  }
  return c;
}
const campStart = c => c.day - (LAW.campaignDays[c.type] - 1);
const inCampaign = c => S.day >= campStart(c) && S.day < c.day;
const pollBanned = () => Object.values(S.camps).some(c => S.day >= c.day - LAW.pollBan);
const activeCamps = () => Object.values(S.camps).filter(c => c.reg && inCampaign(c));
function nextElection() { return SCHED.find(e => e.day >= S.day); }

function timeline() {
  for (const e of SCHED) {
    const dd = e.day - S.day;
    if (dd > 120 || dd < 0) continue;
    if (!S.camps[e.key] && !S.done[e.key]) {
      S.camps[e.key] = newCamp(e);
      addLog(`${e.name}(${fdate(e.day)}) 공천 일정이 시작되었습니다. 후보자 등록 마감: 선거일 ${LAW.regDeadline[e.type]}일 전.`, 'ok');
      toast(`${e.name} D-${dd}: 선거 탭에서 공천을 준비하세요.`);
    }
    const c = S.camps[e.key];
    if (!c) continue;
    if (dd === LAW.regDeadline[e.type] - 1) regDeadline(c); // 마감일 다음 날 정산
    if (c.reg && S.day === campStart(c)) { addLog(`${c.name} 공식 선거운동 시작 (선거기간 ${LAW.campaignDays[c.type]}일, 공직선거법 제33조).`, 'ok'); toast('공식 선거운동이 시작되었습니다. 거리 유세·방송 광고가 가능합니다.'); }
    if (dd === 0) resolveElection(c);
  }
}
function regDeadline(c) {
  if (!c.reg) { addLog(`${c.name}: 후보자를 등록하지 않아 불참합니다.`, 'bad'); return; }
  // 선거보조금(정치자금법 제25조): 후보자를 추천한 정당에 경상보조금과 같은 총액을 배분
  const sh = subsidyFrac(), amt = LAW.voters * LAW.subsidyUnit * sh;
  if (amt > 0) { earn(amt, '보조금'); addLog(`선거보조금 ${won(amt)} 수령 (정치자금법 제25조·제27조).`, 'ok'); }
  if (c.type !== 'pres' && c.reg.womenRatio >= 0.3) {
    // 여성추천보조금(정치자금법 제26조): 지역구 여성 30% 이상 추천 정당 간 의석·득표 비율로 배분(가정: 푸른내일당도 충족)
    const sP = seatTotal('P'), sC = seatTotal('C'), vP = S.lastVotes.P || 0, vC = S.lastVotes.C || 0;
    const share = 0.5 * (sP + sC ? sP / (sP + sC) : 0) + 0.5 * (vP + vC ? vP / (vP + vC) : 0);
    const w = LAW.voters * LAW.womenSubsidyUnit * share;
    if (w > 0) { earn(w, '보조금'); addLog(`여성추천보조금 ${won(w)} 수령 (지역구 여성 후보 ${pct(c.reg.womenRatio, 0)}, 정치자금법 제26조).`, 'ok'); }
  }
}
function resolveElection(c) {
  const e = c, lines = [];
  let refund = 0, html = '';
  if (c.type === 'nat') {
    const g = simGeneral(c);
    const before = seatTotal('P');
    applySeats(g); S.lastVotes = { ...g.pv };
    S.pool.forEach(p => { if (/국회의원/.test(p.role)) p.role = ''; });
    if (c.reg) {
      S.everNat = true; S.lastPart = S.day;
      g.pDist.forEach(d => { refund += d.cost * L.refundRate(d.share); if (d.win && d.pid != null) { const p = person(d.pid); if (p) p.role = `국회의원(${RK[d.k].n})`; } });
      if (g.pr.P > 0) { refund += c.reg.prCost; c.reg.pr.slice(0, g.pr.P).forEach(x => { const p = x.id != null && person(x.id); if (p) p.role = '비례대표 국회의원'; }); }
    }
    const now = seatTotal('P');
    S.buzz += (now - before) / 8;
    html = natResultHTML(g, c);
    lines.push(`${c.name} 결과: ${S.party.name} ${now}석 (지역구 ${now - S.seats.P.pr}, 비례 ${S.seats.P.pr}) · 비례 득표 ${pct(g.pv.P)}`);
  } else if (c.type === 'gov') {

    if (c.reg) {
      S.lastPart = S.day;
      g.mine.forEach(d => { refund += d.cost * L.refundRate(d.share); if (d.win && d.pid != null) { const p = person(d.pid); if (p) p.role = `${RK[d.k].n} 시·도지사`; } });
    }
    html = govResultHTML(g);

  } else {

    S.president = { party: g.win, name: winName, since: S.day, pid: g.win === 'P' ? c.reg.cand.id : null };
    S.pool.forEach(p => { if (p.role === '대통령') { p.role = '전직 대통령'; p.exPres = true; } });
    if (g.win === 'P') { const p = c.reg.cand.id != null && person(c.reg.cand.id); if (p) p.role = '대통령'; }
    if (c.reg) refund += (c.reg.cand.dep + c.reg.cand.spend) * L.refundRate(g.v.P);
    html = presResultHTML(g, c);
    lines.push(`${c.name} 결과: ${winName}(${pn(g.win)}) 당선` + (c.reg ? ` · ${S.party.name} 후보 ${pct(g.v.P)}` : ''));
  }
  if (refund > 0) {

function partyOrder() {
  const i = S.party.ideo, base = ['B', 'C', 'O', 'A'];

function hemicycle() {
  const total = LAW.totalSeats, rows = 8, R0 = 42, R1 = 100, pts = [];
  const radii = [...Array(rows)].map((_, i) => R0 + (R1 - R0) * i / (rows - 1)), sr = sum(radii);
  const per = radii.map(r => Math.round(total * r / sr));
  per[rows - 1] += total - sum(per);
  radii.forEach((r, i) => { for (let j = 0; j < per[i]; j++) { const a = Math.PI * (1 - j / (per[i] - 1)); pts.push({ x: 110 + r * Math.cos(a), y: 106 - r * Math.sin(a), a }); } });
  pts.sort((p, q) => q.a - p.a);
  const cols = [];
  partyOrder().forEach(id => { for (let n = seatTotal(id); n > 0; n--) cols.push(pc(id)); });
  const dots = pts.map((p, i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.7" fill="${cols[i] || 'none'}" stroke="${cols[i] ? 'none' : 'var(--border)'}"/>`).join('');
  const label = partyOrder().map(id => `${pn(id)} ${seatTotal(id)}석`).join(', ');
  return `<svg viewBox="0 0 220 112" role="img" aria-label="국회 의석 분포: ${esc(label)}" style="width:100%;max-width:440px;display:block;margin:0 auto">${dots}<text x="110" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${sum(partyOrder().map(seatTotal))}석</text></svg>
  <div class="legend" style="justify-content:center;margin-top:6px">${partyOrder().map(id => `<span><i style="background:${pc(id)}"></i>${esc(pn(id))} <b class="num">${seatTotal(id)}</b></span>`).join('')}</div>`;
}

// ---------- 보조금 ----------
function subsidyFrac() {
  if (S.phase !== 'reg') return 0;
  const parties = ['P', 'A', 'B', 'C'].map(id => ({ id, seats: seatTotal(id), voteShare: S.lastVotes[id] || 0, participated: id !== 'P' || S.everNat }));
  return L.subsidyShares(parties).P;
}
const fundCap = () => {
  const y = L.dayToDate(S.day).getUTCFullYear();
  const elecYear = SCHED.some(e => L.dayToDate(e.day).getUTCFullYear() === y);
  return LAW.fundCap * (S.phase === 'prep' ? 0.5 : 1) * (elecYear ? 2 : 1);
};
function raiseFunds(n) {
  const y = L.dayToDate(S.day).getUTCFullYear();
  if (S.fund.year !== y) S.fund = { year: y, raised: 0 };
  const got = Math.max(0, Math.min(n, fundCap() - S.fund.raised));
  S.fund.raised += got; earn(got, '후원금');
  return got;
}

// ---------- 시간 흐름 ----------
function daily() {
  const seats = seatTotal('P');
  const floor = 2 + seats / 4 + govCount('P') * 2 + (S.president.party === 'P' ? 35 : 0);
  S.fame = clamp(Math.max(S.fame - S.fame * 0.003, floor), 0, 100);
  S.trust = clamp(S.trust + (50 - S.trust) * 0.002, 0, 100);
  S.buzz *= 0.97;
  const honey = S.president.party === 'P' ? Math.max(0, 6 - (S.day - S.president.since) / 120) : 0;
  const target = (S.fame / 100) * (0.25 + 0.75 * S.trust / 100) * 40 + seats / 300 * 8 + S.buzz + honey;
  S.support = clamp(S.support + (target - S.support) * 0.03, 0.1, 70);
  for (const id of ['A', 'B', 'C', 'O']) {
    let base = RIV[id].base;
    if (S.president.party === id) base -= Math.min(7, (S.day - S.president.since) / 365 * 1.6); // 집권 피로
    S.rw[id] = clamp(S.rw[id] + (base - S.rw[id]) * 0.01 + gauss() * 0.12, 1, 60);
  }
}
function monthly(dt) {
  S.ledger.last = S.ledger.cur; S.ledger.cur = {};
  for (const r of R) {
    let m = S.members[r.k] || 0;
    m -= m * (S.up.academy ? 0.006 : 0.012);
    m += r.voters * 1e6 * regSupport(r.k) / 100 * 0.00006 * (S.up.digital ? 2 : 1) * rr(0.6, 1.4);
    S.members[r.k] = Math.round(m);
  }
  const tm = totalMembers();
  earn(tm * (S.up.digital ? 0.35 : 0.25) * 1000, '당비');
  raiseFunds(S.fame * S.fame * 1.5e4);
  spend(officeCost(), '운영비');
  const nch = Object.keys(S.chapters).length;
  if (nch) spend(nch * 3e6, '시·도당');
  const upm = sum(UPS.filter(u => S.up[u.k]).map(u => u.m));
  if (upm) spend(upm, '시설');
  if (rnd() < 0.5) { S.issue = pick(ISSUES).k; addLog(`이번 달 핵심 쟁점: ${ISSUES.find(i => i.k === S.issue).n}`); }
  if (dt.getUTCMonth() === 0) S.pool.forEach(p => p.age++);
  S.hist.push(snapPoll()); if (S.hist.length > 150) S.hist.shift();
  // 법적 위험: 적발 판정 / 공소시효
  const mul = { easy: 0.7, normal: 1, hard: 1.3 }[S.diff];
  S.risks = S.risks.filter(k => {
    if (S.day > k.until) { addLog(`'${k.label}' 공소시효가 지났습니다.`); return false; }
    if (rnd() < k.p * mul) { S.queue.push({ risk: k }); return false; }
    return true;
  });
  // 인재 스캔들
  S.pool.forEach(p => { if (!p.leader && rnd() < (100 - p.integ) / 100 * 0.012) S.queue.push({ ev: 'scandal', pid: p.id }); });
  if (S.phase === 'reg' && S.day - S.lastPart > 3.5 * 365) toast(`선거 미참여 경고: ${fdate(S.lastPart + 4 * 365)}까지 선거에 참여하지 않으면 등록이 취소됩니다.`, 'bad');
  checkAch();
}
function quarterly() {
  const sh = subsidyFrac();

  const amt = LAW.voters * LAW.subsidyUnit / 4 * sh;
  earn(amt, '보조금');
  // 정치자금법 제28조 용도 지정: 정책연구소 30%, 여성정치발전 10%, 청년정치발전 5% 이상

  S.fame = clamp(S.fame + 0.5, 0, 100); S.trust = clamp(S.trust + 0.5, 0, 100);
  addLog(`경상보조금 ${won(amt)} 수령 (배분율 ${pct(sh, 2)}, 정치자금법 제25조·제27조). 45%는 정책연구소·여성·청년정치발전에 의무 배정.`, 'ok');

function checkGameOver() {

    } else if (S.grace != null) { S.grace = null; addLog('정당 등록요건을 회복했습니다.', 'ok'); }

  if (S.negDays === 30) toast('자금이 바닥났습니다. 120일 안에 회복하지 못하면 당이 해산합니다.', 'bad');
  if (S.negDays > 120) gameOver('재정 파탄', '부채를 감당하지 못해 당 운영이 중단되었습니다.');
}
function tick() {
  if (S.over) return;
  S.day++;

  S.pending = S.pending.filter(p => { if (S.day >= p.d) { earn(p.amt, '보전·반환'); addLog(`${p.t} ${won(p.amt)} 입금`, 'ok'); Snd.sfx('cash'); return false; } return true; });
  timeline();
  if (dt.getUTCDate() === 1) monthly(dt);
  if ([1, 4, 7, 10].includes(dt.getUTCMonth()) && dt.getUTCDate() === 15) quarterly();
  checkGameOver();
  if (!modalOpen && !S.queue.length && rnd() < 1 / 24) randomEvent();
  if (!modalOpen) processQueue();
  renderTop();
}

// ---------- 턴: 1턴 = 1주. 행동력을 쓰고 '턴 종료'하면 7일이 하루씩 흐름 ----------
const TURN = 7, AP = 3;

function endTurn() {
  if (!S || S.over || left || modalOpen) return;

}

}

const eligible = (p, kind) => p && !p.ban && p.age >= LAW.age[kind] && !(kind === 'pres' && p.exPres) && !/대통령$/.test(p.role);
function buildReg(c) {
  const d = c.draft, err = [];
  if (S.phase !== 'reg') err.push('등록된 정당만 후보자를 추천할 수 있습니다.');
  const used = new Map();
  const use = (p, where) => { if (used.has(p.id)) err.push(`${p.name}: ${used.get(p.id)}와(과) ${where} 중복 입후보 불가`); used.set(p.id, where); };
  const out = { cost: 0, deposits: 0 };
  const recCount = { n: 0 };
  const mk = (p, kind, spendC, spendB) => {
    const dep = L.deposit(kind, p.age);
    out.cost += dep + spendC; out.deposits += dep; recCount.n += p.rec ? p.rec.length : 0;
    return { id: p.id, name: p.name, gender: p.gender, age: p.age, fame: p.fame, skill: p.skill, rec: p.rec || [], dep, spend: spendC, spendB };
  };
  if (c.type === 'nat') {
    out.dist = {}; let women = 0, total = 0;
    for (const r of R) {
      const x = d.reg[r.k], n = clamp(+x.n || 0, 0, r.seats), list = [];
      if (x.strat && n > 0) { const p = person(x.strat); if (!eligible(p, 'nat')) err.push(`${p ? p.name : '?'}: 피선거권 요건 미충족`); else { use(p, `${r.n} 지역구`); list.push(p); } }
      while (list.length < n) list.push(genericCand(rnd() < d.women / 100 ? 'F' : 'M'));
      out.dist[r.k] = list.map(p => mk(p, 'nat', NAT_SPEND[x.spend].c, NAT_SPEND[x.spend].b));
      women += list.filter(p => p.gender === 'F').length; total += list.length;
    }
    out.womenRatio = total ? women / total : 0;
    // 비례대표: 여성 50% 이상, 홀수 순번 여성 (공직선거법 제47조 제3항)
    const prN = clamp(+d.prN || 0, 0, LAW.prSeats);
    const picks = d.prIds.map(person).filter(Boolean).slice(0, prN);
    picks.forEach(p => { if (!eligible(p, 'nat')) err.push(`${p.name}: 피선거권 요건 미충족`); else use(p, '비례대표'); });
    const F = picks.filter(p => p.gender === 'F'), M = picks.filter(p => p.gender === 'M'), list = [];
    for (let i = 1; i <= prN; i++) list.push(i % 2 ? (F.shift() || genericCand('F')) : (M.shift() || F.shift() || genericCand('M')));
    if (M.length) err.push(`비례대표 명부에 남성 인재가 너무 많습니다 (짝수 순번에만 배치 가능)`);
    const before = out.cost;
    out.pr = list.map(p => mk(p, 'pr', 0, 0));
    out.prCost = out.cost - before;
    if (!total && !prN) err.push('지역구 또는 비례대표 후보를 1명 이상 추천하세요.');
    out.count = total + prN;
  } else if (c.type === 'gov') {
    out.gov = {}; let women = 0, total = 0;
    for (const r of R) {
      const x = d.reg[r.k]; if (!x.run) continue;
      let p = x.cand ? person(x.cand) : genericCand(rnd() < d.women / 100 ? 'F' : 'M');
      if (x.cand) { if (!eligible(p, 'gov')) { err.push(`${p ? p.name : '?'}: 피선거권 요건 미충족`); continue; } use(p, `${r.n} 시·도지사`); }
      const lim = govLimit(r.k);
      out.gov[r.k] = mk(p, 'gov', lim * GOV_SPEND[x.spend].f, GOV_SPEND[x.spend].b);
      total++; if (p.gender === 'F') women++;
    }
    out.womenRatio = total ? women / total : 0;
    if (!total) err.push('출마할 지역을 1곳 이상 고르세요.');
    out.count = total;
  } else {
    const p = person(d.cand);
    if (!p) err.push('대통령 후보를 고르세요 (당내 경선 결과).');
    else if (!eligible(p, 'pres')) err.push(`${p.name}: 대통령 피선거권은 만 40세 이상·5년 이상 국내 거주 (헌법 제67조·공직선거법 제16조)${p.exPres ? ', 대통령은 중임 불가(헌법 제70조)' : ''}`);
    else { out.cand = mk(p, 'pres', PRES_SPEND[d.spend].c, PRES_SPEND[d.spend].b); out.cost += 5e7; } // 당내경선 관리비
    out.count = 1;
  }
  out.recs = recCount.n;
  if (out.cost > S.money) err.push(`비용 ${won(out.cost)}이(가) 보유 자금 ${won(S.money)}보다 많습니다.`);
  if (S.day > c.day - LAW.regDeadline[c.type]) err.push('후보자 등록 기간이 지났습니다.');
  return { out, err };
}

function randomEvent() {
  const pool = EVENTS.filter(e => e.cond());
  const w = sum(pool.map(e => e.w));
  let x = rnd() * w;
  const e = pool.find(e => (x -= e.w) < 0);
  if (e) showEvent(e);
}

$('#importFile').onchange = ev => {

    try { const o = JSON.parse(rd.result); if (!(o && o.v === 1 && o.party)) throw 0; S = o; S.ap ??= AP; left = 0; save(); closeModal(); renderAll(); toast('저장 파일을 불러왔습니다.', 'ok'); }

function openModal({ title, html, buttons = [], wide, dismiss = true, onOpen }) {
  modalOpen = true;
  const root = $('#modalRoot');
  root.innerHTML = `<div class="scrim"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2><div>${html}</div>${buttons.length ? `<div class="btns" style="margin-top:16px;justify-content:flex-end">${buttons.map((b, i) => `<button class="btn ${b.pri ? 'pri' : ''}" data-b="${i}">${esc(b.t)}</button>`).join('')}</div>` : ''}</div></div>`;
  const m = root.querySelector('.modal');
  root.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { const bt = buttons[+b.dataset.b]; Snd.sfx('click'); closeModal(); if (bt.fn) bt.fn(); });
  if (dismiss) root.querySelector('.scrim').onclick = ev => { if (ev.target === ev.currentTarget) closeModal(); };
  root.dataset.dismiss = dismiss ? '1' : '';
  if (onOpen) onOpen(m);
  (m.querySelector('[autofocus]') || m.querySelector('button,input,select'))?.focus();
}
function closeModal() { $('#modalRoot').innerHTML = ''; modalOpen = false; renderAll(); if (left) turnTimer = setTimeout(runTurn, 90); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOpen && $('#modalRoot').dataset.dismiss) closeModal();
  if (modalOpen || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || !S) return;
  if (e.key === ' ' && !/BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); endTurn(); }
});
function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 4000);
  while ($('#toasts').children.length > 4) $('#toasts').firstChild.remove();
}

function pollChart(ban) {
  const h = S.hist.slice(-60);
  if (h.length < 2) return '<p class="empty">한 달 이상 지나면 추이가 표시됩니다.</p>';
  const W = 600, H = 200, pl = 34, pr = 100, pt = 10, pb = 24;
  const ids = ban ? ['P'] : ['B', 'A', 'C', 'P'];
  const max = Math.max(10, ...h.flatMap(x => ids.map(id => x[id]))) * 1.1;
  const X = i => pl + (W - pl - pr) * i / (h.length - 1), Y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(max * f));
  const grid = ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--border)"/><text x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}%</text>`).join('');
  const xl = [0, h.length - 1].map(i => { const t = L.dayToDate(h[i].d); return `<text x="${X(i)}" y="${H - 6}" text-anchor="${i ? 'end' : 'start'}" font-size="11" fill="var(--muted)">${t.getUTCFullYear()}.${t.getUTCMonth() + 1}</text>`; }).join('');
  const lines = ids.map(id => { const last = h[h.length - 1][id]; return `<polyline fill="none" stroke="${pc(id)}" stroke-width="${id === 'P' ? 3 : 2}" points="${h.map((x, i) => `${X(i).toFixed(1)},${Y(x[id]).toFixed(1)}`).join(' ')}"/><text x="${W - pr + 6}" y="${Y(last) + 4}" font-size="12" font-weight="700" fill="${pc(id)}">${esc(pn(id).slice(0, 5))} ${last}%</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="정당 지지율 월별 추이" style="width:100%;height:auto">${grid}${xl}${lines}</svg>`;
}

// 현재 상태에서 급한 일부터: [문구, 이동할 탭, 경고 여부]
function nextSteps() {
  if (S.over) return [['게임이 끝났습니다. 설정에서 새 게임을 시작하세요.', '', true]];
  const out = [];
  if (S.money < 0) out.push([`자금이 바닥났습니다(${S.negDays}일째). 120일 안에 흑자로 돌리지 못하면 해산합니다. 후원의 밤으로 모금하세요.`, 'act', true]);
  if (S.grace != null) out.push([`정당 등록요건 미달: ${fdate(S.grace)}까지 시·도당 5곳(각 당원 1,000명)을 회복하세요.`, 'org', true]);
  if (S.phase === 'reg' && S.day - S.lastPart > 3 * 365) out.push([`4년간 선거에 나가지 않으면 등록이 취소됩니다(${fdate(S.lastPart + 4 * 365)}까지). 다음 선거에 후보를 내세요.`, 'elec', true]);
  if (S.phase === 'prep') {
    const ok = chaptersOk(), ready = R.filter(r => !S.chapters[r.k] && S.members[r.k] >= LAW.chapterMembers);
    if (ok >= LAW.minChapters) out.push(['시·도당 요건을 채웠습니다. 본부 탭에서 정당 등록을 신청하세요.', 'home']);
    else {
      if (ready.length) out.push([`${ready.map(r => r.n).join('·')}: 당원 1,000명을 넘었습니다. 시·도당 창당대회를 여세요.`, 'org']);
      out.push([`시·도당 ${LAW.minChapters - ok}곳이 더 필요합니다(등록 기한 ${LAW.prepDays - S.day}일 남음). 조직·지역 탭에서 지역을 골라 당원을 모집하세요.`, 'org', LAW.prepDays - S.day < 45]);
    }
  }
  if (S.phase === 'reg') for (const c of Object.values(S.camps)) {
    const dl = c.day - LAW.regDeadline[c.type] - S.day;
    if (!c.reg && dl >= 0) out.push([`${c.name}: 후보자 등록 마감까지 ${dl}일. 선거 탭에서 공천하세요.`, 'elec', dl < 14]);
  }
  if (activeCamps().length) out.push(['공식 선거운동기간입니다. 거리 유세(조직·지역)와 방송 광고(활동)로 득표력을 올리세요.', 'act']);
  if (S.phase === 'reg' && subsidyFrac() > 0 && !S.up.inst) out.push(['보조금을 받는 정당은 정책연구소를 두어야 합니다. 활동 탭에서 설립하세요.', 'act']);
  if (!out.length && S.phase === 'reg') {
    const ne = nextElection();
    out.push([ne ? `다음 선거는 ${ne.name}(D-${ne.day - S.day})입니다. 선거일 120일 전에 공천이 열리니 그때까지 당원·인지도·인재를 키우세요.` : '당원·인지도·인재를 키우세요.', 'act']);
  }
  out.push([S.ap ? `이번 턴 행동력이 ${S.ap} 남았습니다. 다 쓰면 '턴 종료'(Space)를 누르세요.` : `행동력을 다 썼습니다. '턴 종료'(Space)를 누르세요.`, '']);
  return out;
}

      m.querySelector('#sExp').onclick = exportSave;
      m.querySelector('#sImp').onclick = () => $('#importFile').click();
      m.querySelector('#sNew').onclick = () => openModal({ title: '새 게임', html: '<p>현재 진행 상황을 지우고 새로 시작할까요? 필요하면 먼저 파일로 내보내세요.</p>', buttons: [{ t: '취소' }, { t: '새로 시작', pri: true, fn: newGameModal }] });
    },
  });
}
function newGameModal() {
  left = 0;
  openModal({
    title: '정당 창당', dismiss: false, html: `
    <p class="muted small">발기인 200명과 함께 중앙당창당준비위원회를 결성합니다. 6개월 안에 5개 이상 시·도당(각 당원 1,000명)을 만들어 선관위에 등록하세요.</p>
    <form id="ng" style="display:flex;flex-direction:column;gap:12px">
      <label class="f">정당 이름 *<input type="text" name="name" maxlength="12" required value="새미래당" autocomplete="off"><span class="h" id="ngErr" role="alert"></span></label>
      <div class="f">정당 색<div class="swatches">${PCOLORS.map(([n, c], i) => `<label><input type="radio" name="color" value="${c}" ${i ? '' : 'checked'}><span style="background:${c}" title="${n}"></span><b class="sr">${n}</b></label>`).join('')}</div></div>
      <div class="row">
        <label class="f">노선<select name="ideo"><option value="1">진보</option><option value="0" selected>중도</option><option value="-1">보수</option></select></label>
        <label class="f">창당 본거지<select name="home">${R.map(r => `<option value="${r.k}" ${r.k === 'seoul' ? 'selected' : ''}>${r.n}</option>`).join('')}</select></label>
        <label class="f">난이도<select name="diff"><option value="easy">쉬움 (6억)</option><option value="normal" selected>보통 (3억)</option><option value="hard">어려움 (1.5억)</option></select></label>
      </div>
      <div class="row">
        <label class="f">당 대표 이름 *<input type="text" name="leader" maxlength="8" required value="${genName('M')}"></label>
        <label class="f">나이<input type="number" name="age" min="18" max="85" value="45"><span class="h">대선 출마는 40세 이상</span></label>
        <label class="f">성별<select name="gender"><option value="M">남</option><option value="F">여</option></select></label>
      </div>
      <label class="f">슬로건<input type="text" name="slogan" maxlength="30" placeholder="선택 사항"></label>
      <button class="btn pri" type="submit">창당준비위원회 결성 신고</button>
    </form>`,
    onOpen: m => {
      const f = m.querySelector('#ng');
      f.onsubmit = e => {
        e.preventDefault();
        const v = Object.fromEntries(new FormData(f));
        v.name = v.name.trim(); v.leader = v.leader.trim();
        const clash = Object.values(RIV).find(x => v.name.replace(/당$/, '') && (x.name.includes(v.name.replace(/당$/, '')) || v.name.includes(x.name.replace(/당$/, ''))));
        const err = !v.name ? '정당 이름을 입력하세요.' : clash ? `기존 등록 정당 '${clash.name}'과(와) 뚜렷이 구별되지 않습니다 (정당법 제41조).` : !v.leader ? '대표 이름을 입력하세요.' : '';
        if (err) { m.querySelector('#ngErr').textContent = err; m.querySelector('#ngErr').className = 'h bad'; Snd.sfx('bad'); return; }
        v.age = clamp(+v.age || 45, 18, 85);
        newState(v); save(); closeModal(); tab = 'guide'; renderAll(); Snd.sfx('ok');
        toast(`매 턴(1주) 행동력 ${AP}만큼 활동하고 '턴 종료'(Space)를 누르세요. 막히면 '가이드' 탭을 보세요.`);
      };
    },
  });
}

// ---------- 시작 ----------
(function boot() {
  S = loadSave();
  if (S) { renderAll(); openModal({ title: '정당 키우기', html: `<p><b>${esc(S.party.name)}</b> · ${fdate(S.day)} 저장 기록이 있습니다.</p>`, dismiss: false, buttons: [{ t: '새 게임', fn: newGameModal }, { t: '이어하기', pri: true }] }); if (S.over) gameOver(S.over.title, S.over.text); }
  else newGameModal();
})();
// 대선 단일화 제안 트리거(선거운동기간, 우리 후보가 앞설 때 한 번)
setInterval(() => {
  if (!S || modalOpen) return;
  for (const c of activeCamps()) if (c.type === 'pres' && c.rivals.C && !c.unified && !c.unifyAsked && S.support > poll().C) { c.unifyAsked = true; S.queue.push({ ev: 'unify', key: c.key }); }
}, 1000);
</script>
</body>
</html>
