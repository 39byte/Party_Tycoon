<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정당 키우기</title>
<style>
/* 게임 GUI 스킨: 남색 상황실 크롬(상단 HUD·메뉴) + 금색 강조. 정부·공공 팔레트(navy) + 금색 CTA */
:root{
  --bg:#E6EBF2; --surface:#FFFFFF; --surface2:#EEF2F8; --fg:#0F172A; --muted:#475569; --border:#C9D3E1;
  --primary:#1E3A8A; --primary2:#2F55C8; --on-primary:#FFFFFF; --accent:#0369A1; --warn:#B45309; --danger:#DC2626; --ok:#15803D;
  --gold:#F2B33D; --gold2:#C27A06; --on-gold:#1C1303;
  --hud:#0E1A33; --hud2:#18294D; --hud-line:#2B3F69; --on-hud:#EAF0FA; --on-hud-muted:#A9B8D2;
  --ring:#2F55C8; --party:#EA580C;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 0 rgba(15,23,42,.06),0 6px 16px -8px rgba(15,23,42,.25);
  --r:12px; --font:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#081020; --surface:#101B31; --surface2:#172540; --fg:#E2E8F0; --muted:#A3B1C6; --border:#283A5E;
  --primary:#2F55C8; --primary2:#4B73E6; --on-primary:#FFFFFF; --accent:#38BDF8; --warn:#FBBF24; --danger:#F87171; --ok:#4ADE80;
  --hud:#060D1C; --hud2:#0F1C36; --hud-line:#22355A;
  --ring:#7AA2FF; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 20px -10px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
/* 여러 문장 글: 문장 단위로 줄을 바꾸고, 한 줄에 안 들어가는 문장만 띄어쓰기에서 바꿈 (sentWrap) */
.sent{display:inline-block}
button,input,select{font:inherit;color:inherit;accent-color:var(--primary2)}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:16px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.ok{color:var(--ok)} .bad{color:var(--danger)} .warn{color:var(--warn)}

/* top bar */
/* 상단 HUD: 늘 어두운 상황판. 자원 수치는 아이콘 달린 캡슐 */
.top{position:sticky;top:0;z-index:20;background:var(--hud);color:var(--on-hud);border-bottom:2px solid var(--gold2);box-shadow:0 4px 14px rgba(2,6,23,.35);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;min-width:0;letter-spacing:-.01em}
/* 정당 문장(엠블럼): 당 색 방패 */
.chip{width:26px;height:30px;flex:none;background:var(--party);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.stats{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.stat{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:7px;align-items:center;line-height:1.15;padding:4px 10px 4px 6px;border:1px solid var(--hud-line);border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.stat .ic{grid-row:1/3;width:26px;height:26px;padding:5px;border-radius:7px;background:rgba(242,179,61,.14);color:var(--gold)}
.stat b{font-size:15px;color:#fff}
.stat b.bad{color:#FF8A8A}
.stat span{font-size:11.5px;color:var(--on-hud-muted)}
.ctrls{display:flex;gap:6px;align-items:center}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:40px;height:40px;padding:0 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;transition:background .15s,transform .08s}
.ib:hover{background:var(--surface2)}
.ib:active{transform:translateY(1px)}
.ib[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.top .ib{background:rgba(255,255,255,.06);border-color:var(--hud-line);color:var(--on-hud)}
.top .ib:hover{background:rgba(255,255,255,.12)}
/* 턴 종료: 화면의 단 하나뿐인 금색 메인 버튼 */
.top #endTurn{min-height:44px;padding:8px 20px;font-size:15.5px;font-weight:800;color:var(--on-gold);border:1px solid var(--gold2);background:var(--gold);box-shadow:0 3px 0 var(--gold2),0 6px 14px rgba(242,179,61,.3)}
.top #endTurn:hover:not(:disabled){filter:brightness(1.06);background:var(--gold)}
.top #endTurn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--gold2)}
.top #endTurn:disabled{opacity:1;color:var(--on-hud-muted);background:var(--hud2);border-color:var(--hud-line);box-shadow:none}
.top :focus-visible{outline-color:var(--gold)}

/* layout */
.app{display:grid;grid-template-columns:196px 1fr;min-height:calc(100dvh - 58px)}
/* 메뉴: HUD와 같은 어두운 사이드바, 현재 탭은 금색 테두리 판 */
nav{border-right:1px solid var(--hud-line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;background:var(--hud);color:var(--on-hud)}
nav button{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 12px;border:1px solid transparent;border-radius:10px;background:none;color:var(--on-hud-muted);cursor:pointer;text-align:left;font-weight:600;transition:background .15s,color .15s}
nav button .ic{width:20px;height:20px}
nav button:hover{background:rgba(255,255,255,.07);color:var(--on-hud)}
nav button[aria-current="page"]{color:#fff;font-weight:800;border-color:rgba(242,179,61,.55);background:rgba(242,179,61,.14);box-shadow:inset 3px 0 0 var(--gold)}
nav button[aria-current="page"] .ic{color:var(--gold)}
nav :focus-visible{outline-color:var(--gold)}
nav .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:800;min-width:20px;text-align:center;padding:0 6px;box-shadow:0 0 0 2px var(--hud)}
main{padding:18px;min-width:0}
/* 메뉴 묶음 구분선(연하게). 읽을거리 묶음은 위를 더 띄움. 좁은 화면(가로·하단 메뉴)에선 숨김 */
.navsep{border:0;border-top:1px solid rgba(255,255,255,.1);margin:6px 8px}
.navsep.wide{margin-top:22px}
@media (max-width:900px){.navsep{display:none}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.span-2{grid-column:span 2} .span-3{grid-column:1/-1}
/* 좌우 분할: 한 칸이 360px보다 좁아지면 한 줄로 쌓임 */
.stack{display:flex;flex-direction:column;gap:14px;min-width:0} .stack>.card{margin-top:0!important}
@media (max-width:900px){.home>.stack{display:contents}}
.split{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));align-items:start;container-type:inline-size}
/* 좌우로 나뉠 만큼 넓을 때만(360×2+14) 오른쪽 칸이 스크롤을 따라옴. 상단바 높이(--top-h)는 JS가 맞춤. 화면보다 길면 칸 안에서 스크롤 */
@container (min-width:734px){.split>.follow{position:sticky;top:calc(var(--top-h,58px) + 12px);max-height:calc(100dvh - var(--top-h,58px) - 24px);overflow:auto;overscroll-behavior:contain}}
/* 패널: 윗변 띠 + 제목 앞 금색 표식으로 게임 창처럼 */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
/* 파란 윗선은 탭 맨 윗줄 카드에만(markLead가 .lead를 붙임) */
.card.lead{border-top:3px solid var(--primary)}
.card>h2:first-child{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:-2px -16px 12px;padding:0 16px 10px;border-bottom:1px solid var(--border)}
.card>h2:first-child::before{content:"";width:8px;height:8px;flex:none;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 0 2px rgba(242,179,61,.25)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--hud-line);padding:6px}
  nav button{flex:1 1 18%;justify-content:center;padding:8px 4px;font-size:13px}
  nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--gold)}
  .grid{grid-template-columns:1fr} .span-2{grid-column:auto}
}
@media (max-width:600px){
  .stats{order:3;flex-basis:100%;gap:4px 14px}
  .brand{flex:1}
  main{padding:10px}
}
/* 모바일: 하단 탭바 4개 + 더보기. 60열 격자: 주 탭 12칸 × 5, 더보기 시트의 보조 탭 8개는 15칸 × 4씩 두 줄 */
nav .more{display:none}
@media (max-width:640px){
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(60,minmax(0,1fr));gap:4px 0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-bottom:0;border-top:2px solid var(--gold2);background:var(--hud);box-shadow:0 -4px 16px rgba(2,6,23,.3)}
  nav button{grid-column:span 12;flex-direction:column;gap:2px;min-height:52px;padding:6px 2px;font-size:11.5px}
  nav button[aria-current="page"],nav .more.cur{box-shadow:inset 0 3px 0 var(--gold);font-weight:800;color:#fff}
  nav .sec{display:none;order:-1;grid-column:span 15;flex-direction:row;min-height:48px;font-size:13px}
  nav.open .sec{display:flex}
  nav.open{border-top-left-radius:14px;border-top-right-radius:14px}
  nav .more{display:flex}
  nav button{position:relative}
  nav .badge{position:absolute;top:4px;left:calc(50% + 6px);margin:0}
  nav .more[aria-expanded="true"]{background:rgba(255,255,255,.08);color:#fff}
  /* 좁은 화면: 아이콘 빼고 3열 격자로 HUD 높이를 줄임 */
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .stat{display:flex;flex-direction:column;padding:3px 8px} .stat .ic{display:none}
  .stat b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom))}
}

/* buttons */
/* 버튼: 아랫변 두께로 눌리는 깊이를 주고, 누르면 내려앉음 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);box-shadow:0 2px 0 var(--border);cursor:pointer;font-weight:700;touch-action:manipulation;transition:background .15s,filter .15s,transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 2px 0 #142A66}
.btn.pri:hover:not(:disabled){background:var(--primary2)}
.btn.pri:active:not(:disabled){box-shadow:none}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* actions: 카드형 명령 슬롯 */
.acts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.act{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);transition:border-color .15s,transform .15s,box-shadow .15s}
.act:hover{border-color:var(--primary2);box-shadow:0 6px 16px -10px var(--primary2)}
.act h3{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* 활동 탭: 가로로 길고 낮은 카드. 설명·비용은 왼쪽, 실행 버튼은 오른쪽 */
.acts.wide{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.acts.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.acts.wide{grid-template-columns:1fr}}
/* 당 시설·조직: 1행 4열(좁으면 2열·1열) */
.acts.ups{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.acts.ups{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.acts.ups{grid-template-columns:1fr}}
.act.row2{flex-direction:row;align-items:center;gap:14px;padding:10px 14px}
.act.row2 .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.act.row2 .meta{margin-top:2px;justify-content:flex-start;gap:12px}
.act.row2 .why{min-height:0}
.act.row2{align-items:flex-start}
.act.row2{align-items:stretch}
/* 오른쪽 칸 폭 고정: 모든 카드에서 구분선 위치가 같고, 실행 버튼은 칸 폭을 꽉 채움 */
.act.row2 .side{flex:none;width:136px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding-left:14px;border-left:1px solid var(--border);font-size:12.5px;color:var(--muted);white-space:nowrap}
.act.row2 .side .btn{width:100%;margin-bottom:4px}
.act.row2 .bell{margin-left:2px}
.act .bell{min-width:30px;height:30px;padding:0;margin-left:auto;border-radius:8px}
.act .bell .ic{width:16px;height:16px}
.act .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.act .why{font-size:12.5px;color:var(--warn)}
/* 기본 카드: 같은 줄 카드끼리 제목·설명·실행 버튼·비용·사유 줄을 맞춤(subgrid) → 설명 길이가 달라도 실행 버튼 높이가 같음 */
.acts:not(.wide):not(.ups)>.act{display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:6px;align-content:start}
.act p{margin:0;font-size:13px;color:var(--muted)}

/* progress */
/* 게이지: 홈이 파인 트랙 + 윤기 있는 채움 */
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(2,6,23,.25)}
.bar>i{display:block;height:100%;background:var(--party);border-radius:inherit;transition:width .4s ease-out}
.seatbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--surface2);box-shadow:inset 0 1px 1px rgba(2,6,23,.2)}
.seatbar>i{display:block;height:100%}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}}
.mapwrap>*{min-width:0}
/* 지도·지역 정보 카드가 각각 한 화면(상단 바 아래)에 들어가게: 지도는 화면 높이에 맞춰 줄이고, 지역 카드는 칸을 촘촘히 */
.mapwrap .kmap{max-height:max(320px,calc(100dvh - 300px))}
/* 2단일 때 지도 카드 높이 = 지역 정보 카드 높이: 지도 카드는 자기 내용으로 줄 높이를 키우지 않고(contain:size) 남는 높이를 지도가 채움 */
@media (min-width:901px){.mapwrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .mapwrap>.card:first-child{contain:size;display:flex;flex-direction:column} .mapwrap .mapbox{flex:1;min-height:240px} .mapwrap .kmap{height:100%;max-height:none}}
.mapwrap .kv th,.mapwrap .kv td{padding:4px 8px}
/* 지역 활동 카드: 카드 수와 카드 폭에 맞춰 칸 수를 정함(빈 칸 없게). 2칸일 때 홀수 개면 마지막 카드는 한 줄 전체 */
.mapwrap>.card:last-child{container-type:inline-size}
.mapwrap .acts{grid-template-columns:minmax(0,1fr);gap:10px}
@container (min-width:380px){.mapwrap .acts{grid-template-columns:repeat(2,minmax(0,1fr))} .mapwrap .acts>.act:last-child:nth-child(odd){grid-column:1/-1}}
@container (min-width:560px){.mapwrap .acts.n3{grid-template-columns:repeat(3,minmax(0,1fr))} .mapwrap .acts.n3>.act:last-child{grid-column:auto}}
@container (min-width:760px){.mapwrap .acts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mapwrap .act{padding:10px 12px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
.tblwrap{overflow-x:auto}
input[type=number],select,input[type=text]{min-height:34px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
input[type=number]{width:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
label.f>span.h{font-weight:400;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

/* list/log */
.log{list-style:none;margin:0;padding:0}
.log li{padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;display:flex;gap:10px}
.log li time{color:var(--muted);font-size:12.5px;white-space:nowrap;padding-top:1px}
.log li.bad{color:var(--danger)} .log li.ok{color:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--muted);font-size:14px;padding:16px 0;text-align:center}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.check .st{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800}
.check .st.done{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.check .st.bad{background:var(--danger);border-color:var(--danger);color:#fff}
.check li>.btn{margin-left:auto;min-height:32px;padding:4px 12px;flex:none}
.guide details{border-bottom:1px solid var(--border);padding:10px 0}
.guide summary{cursor:pointer;font-weight:700;padding:4px 0}
.guide details>:not(summary){font-size:14px;margin:8px 0 0}
.guide details ul{padding-left:20px}
.guide details li{margin:3px 0}
.news{list-style:none;padding:0;margin:6px 0 0}
.news li{padding:8px 0;border-bottom:1px solid var(--border);font-weight:600;font-size:14.5px}
.news li span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ib.fav[aria-pressed="true"] .ic{fill:currentColor} /* 켜진 별은 채움 */

/* 상단 배너: 선거·사회적 이슈 같은 큰 일정 */
/* 상단 배너: HUD 아래 속보 띠 */
.banner{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin:0 -16px -8px;padding:6px 16px;border-top:1px solid var(--hud-line);background:rgba(0,0,0,.22)}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.62);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .18s ease-out}
/* 모달: 남색 제목 띠가 달린 게임 대화창 */
.modal{background:var(--surface);color:var(--fg);border:1px solid var(--hud-line);border-radius:16px;max-width:560px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:0 20px 20px;box-shadow:0 0 0 1px rgba(242,179,61,.35),0 24px 60px rgba(0,0,0,.45);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:860px}
/* 주간 브리핑: 헤드라인 뉴스 | 정치 뉴스 좌우로, 좁으면 위아래로 */
.bsplit{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.bsplit>section+section{border-left:1px solid var(--border);padding-left:20px}
.bsplit h3{margin-bottom:8px}.bsplit h4{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}.bsplit h3+h4{margin-top:0}

.modal>h2{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;font-size:18px;margin:0 -20px 14px;padding:14px 20px;background:var(--hud);color:var(--on-hud);border-bottom:2px solid var(--gold2)}
.modal>h2 .info{color:var(--on-hud-muted);border-color:var(--on-hud-muted)}
.modal>h2 .info:hover,.modal>h2 .info:focus-visible{color:var(--gold);border-color:var(--gold)}
.modal>h2::before{content:"";width:10px;height:10px;flex:none;transform:rotate(45deg);background:var(--gold)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fade{from{opacity:0}}
.modal .lawnote{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 10px;margin:10px 0}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choices .btn{justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;font-weight:600}
.choices .btn small{font-weight:400;color:var(--muted)}
/* 창 안 2단(정책 발표: 헤드라인 | 정책 분야). 좁은 화면에선 위아래로 */
.split2{display:grid;grid-template-columns:1fr 1fr;margin-top:12px} .split2>div{min-width:0;padding:0 14px} .split2>div:first-child{padding-left:0} .split2>div+div{border-left:1px solid var(--border);padding-right:0}
.split2 h3{font-size:14px;margin:0 0 8px} .split2 .choices{margin-top:0}
@media (max-width:640px){.split2{grid-template-columns:1fr;gap:14px}.split2>div{padding:0}.split2>div+div{border-left:0;border-top:1px solid var(--border);padding-top:14px}}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;width:min(400px,calc(100vw - 32px))}
/* 알림: HUD색 판 + 상태 아이콘(종류 제목) + 닫기 + 남은 시간 막대. 마우스를 올리면 멈춤 */
.toast{--tc:var(--gold);position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--hud2);color:var(--on-hud);padding:12px 8px 15px 14px;border:1px solid var(--hud-line);border-radius:12px;font-size:15px;line-height:1.5;box-shadow:0 10px 28px rgba(2,6,23,.4);overflow:hidden;animation:tin .22s cubic-bezier(.2,.9,.3,1)}
.toast.bad{--tc:#F87171} .toast.ok{--tc:#4ADE80}
.toast .tico{display:grid;place-items:center;width:30px;height:30px;margin-top:2px;border-radius:8px;color:var(--tc);background:color-mix(in srgb,var(--tc) 16%,transparent)}
.toast .tico .ic{width:16px;height:16px}
.toast b{display:block;font-size:13px;font-weight:800;color:var(--tc);line-height:1.3;margin-bottom:3px}
.toast p{margin:0;font-weight:500;color:#F5F8FD;text-wrap:pretty}
.toast .tx{width:28px;height:28px;margin:-4px 0 0;border:0;border-radius:8px;background:none;color:var(--on-hud-muted);font-size:18px;line-height:1;cursor:pointer}
.toast .tx:hover,.toast .tx:focus-visible{color:var(--on-hud);background:rgba(255,255,255,.08)}
.toast .tbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--tc);transform-origin:left;animation:tbar var(--d) linear forwards}
.toast:hover .tbar,.toast:focus-within .tbar{animation-play-state:paused}
.toast.out{animation:tout .16s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateX(24px)}}
@keyframes tout{to{opacity:0;transform:translateX(24px)}}
@keyframes tbar{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:34px;height:34px;border-radius:8px;border:3px solid transparent}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* (i) 설명 버튼과 툴팁 */
.tip{font-size:13px;color:var(--muted)}
/* 지방 정부 탭 단체장 카드: 직명·이름이 한 줄씩 들어가게 초상·버튼을 줄임 */
.gov .who{gap:7px} .gov .face{width:36px;height:36px;border-radius:10px}
.gt{flex:1;min-width:0;line-height:1.3}.gt .small{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gt h3{overflow-wrap:anywhere}

/* 후보자 등록 현황: 지역구 | 비례대표 2단, 좁은 화면에선 위아래로 */
.regsplit{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:8px;margin-top:10px}
.regsplit>div{padding:10px 12px;min-width:0} .regsplit>div+div{border-left:1px solid var(--border)}
.regsplit h3{font-size:14px;margin:0 0 6px} .regsplit ul{margin:0;padding-left:18px;max-height:240px;overflow-y:auto;font-variant-numeric:tabular-nums}
@media (max-width:640px){.regsplit{grid-template-columns:1fr}.regsplit>div+div{border-left:0;border-top:1px solid var(--border)}}
/* 의회 법안 목록 */
.bills{list-style:none;margin:0;padding:0}
.bills>li{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--border)}
.bills .btns .btn{min-height:34px;padding:4px 12px}
.billh{display:flex;align-items:flex-start;gap:10px}.billh>div{flex:1;min-width:0}.billh>.btn{flex:none;min-height:34px;padding:4px 12px}

/* 카드 제목 오른쪽 끝: 스위치 · (i) */
.h2r{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:32px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.sw input{appearance:none;position:relative;width:38px;height:22px;margin:0;border-radius:99px;background:var(--border);cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}

.tipw{display:inline-flex;vertical-align:middle;margin-left:6px}
.info{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;padding:0;margin-left:2px;border:1.5px solid var(--muted);border-radius:50%;background:none;color:var(--muted);font:italic 700 11px/1 Georgia,"Times New Roman",serif;cursor:help}
.info::after{content:"";position:absolute;inset:-6px} /* 보이는 원은 작게, 누르는 영역은 29px 유지 */

.tipbox{position:fixed;left:0;top:0;z-index:70;width:max-content;max-width:min(340px,calc(100vw - 16px));padding:10px 12px;border:1px solid var(--hud-line);border-radius:10px;background:var(--hud2);color:var(--on-hud);box-shadow:0 8px 24px rgba(2,6,23,.35);font-size:13px;font-weight:400;line-height:1.55;letter-spacing:0;text-align:left;white-space:normal;word-break:keep-all;overflow-wrap:break-word;visibility:hidden;opacity:0;transition:opacity .12s;pointer-events:none}

.tipbox .tip{margin:0;color:inherit} .tipbox .tip+.tip{margin-top:6px}

/* ---------- 그래픽(art.js) ---------- */
:root{
  --sky1:#B5D3F0; --sky2:#DCEBFA; --far:#B7CAE2; --mid:#93A9C6; --bld:#4B5E80; --bld2:#6E83A6; --wall:#EEF2F7; --col:#FAFBFD; --glass:rgba(140,190,240,.28);
  --gnd:#86AD72; --gnd2:#5E8A50; --tree:#4E8A4A; --trunk:#6B4A2B; --wd:rgba(255,255,255,.6); --wl:#FFE08A; --door:#334155; --mtn:#9DBFA9; --mtn2:#78A585; --roof:#B45309; --ppl:#334155; --other:#64748B;
  --sea:#D6E7F6; --land:#F4F1E8; --map-line:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root{
  --sky1:#0C1730; --sky2:#1B2B55; --far:#132040; --mid:#1A2949; --bld:#22335A; --bld2:#2E4370; --wall:#2A3A5E; --col:#3A4D78; --glass:rgba(80,130,220,.16);
  --gnd:#16301F; --gnd2:#1F4A2D; --tree:#1E4A33; --trunk:#3B2A1A; --wd:rgba(255,255,255,.07); --wl:#FFD36B; --door:#0B1220; --mtn:#1A2E3A; --mtn2:#173440; --roof:#7C3A0C; --ppl:#0A1222; --other:#475569;
  --sea:#0A1830; --land:#25344F; --map-line:#0A1830;
}}
/* 탭 장면: 위쪽 그림 띠 + 왼쪽 제목 */
.scene{position:relative;height:112px;border-radius:var(--r);overflow:hidden;margin-bottom:14px;border:1px solid var(--border);box-shadow:var(--shadow);background:var(--sky1)}
/* 그림은 오른쪽 아래에 맞춰 통째로 줄여 넣고(잘림 없음), 빈 왼쪽은 하늘·땅 색으로 이어 줌 */
.scene::before{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:var(--gnd);border-top:2px solid var(--gnd2)}
.scene .scn{position:absolute;inset:0;width:100%;height:100%}
.scene-t{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 16px;color:#fff}
/* 제목은 그림 위 단색 반투명 판에 */
.scene-t>div{align-self:flex-start;padding:8px 14px;border-radius:10px;background:rgba(10,18,36,.72)}
.scene-t h1{font-size:20px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.scene-t h1::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--gold);flex:none}
.scene-t p{margin:0;font-size:13.5px;opacity:.92;max-width:46ch}
@media (max-width:600px){.scene{height:84px;margin-bottom:10px}.scene-t{padding:8px 10px}.scene-t>div{padding:6px 10px}.scene-t h1{font-size:17px}.scene-t p{font-size:11.5px}}
.scn .far rect{fill:var(--far)} .scn .mid{fill:var(--mid)} .scn .wd{fill:var(--wd)} .scn .wl{fill:var(--wl)}
.scn .bld{fill:var(--bld)} .scn .bld2{fill:var(--bld2)} .scn .wall{fill:var(--wall)} .scn .col{fill:var(--col)} .scn .glass{fill:var(--glass)}
.scn .gnd{fill:var(--gnd)} .scn .gnd2{fill:var(--gnd2)} .scn .tree circle{fill:var(--tree)} .scn .trunk{fill:var(--trunk)} .scn .door{fill:var(--door)}
.scn .mtn{fill:var(--mtn)} .scn .mtn2{fill:var(--mtn2)} .scn .ppl{fill:var(--ppl)} .scn .pole{fill:var(--bld)} .scn .shade{fill:none} .scn .skyb{fill:var(--sky1)}
.scn .cloud{fill:#fff;opacity:.75} .scn .sun{fill:#FFD66B} .scn .moon,.scn .moonc,.scn .stars{display:none}
.scn .dome{fill:var(--col)} .scn .domel{fill:none;stroke:var(--bld2);stroke-width:3} .scn .clock{fill:#fff;stroke:var(--bld);stroke-width:3} .scn .hand{stroke:var(--ppl);fill:none}
.scn .box{fill:#F8FAFC;stroke:var(--bld);stroke-width:3} .scn .paper{fill:#fff;stroke:var(--bld2)} .scn .coin{fill:#F2B33D;stroke:#B7791F;stroke-width:1.5}
.scn .scale{fill:var(--gold2);stroke:var(--gold2)} .scn .beam{fill:#FFF3C4;opacity:.35} .scn .road{fill:none;stroke:var(--wall);stroke-width:8;stroke-linecap:round} .scn .giwa{fill:#2F4F8F}
.scn text{font:800 22px var(--font);text-anchor:middle;fill:#fff} .scn .vtxt{font-size:15px;dominant-baseline:middle} .scn .btxt{font-size:30px} .scn .stxt{font-size:12.5px} .scn .stxt.dark{fill:var(--bld)}
@media (prefers-color-scheme:dark){.scn .sun,.scn .cloud{display:none} .scn .moon{display:inline;fill:#F4F1DE} .scn .moonc{display:inline;fill:var(--sky1)} .scn .stars{display:inline;fill:#fff;opacity:.7} .scn .beam{fill:#FFE9A8;opacity:.18} .scn .box{fill:#CBD5E1}}
/* 전국 지도 */
.kmap{display:block;width:100%;height:auto;max-height:min(76vh,780px);margin:0 auto;background:var(--sea);border-radius:12px}
.kmap .rg{stroke:var(--map-line);stroke-width:2.5;stroke-linejoin:round;cursor:pointer;transition:filter .15s}
.kmap .rg:hover{filter:brightness(1.1) saturate(1.1)}
.kmap .rg.sel{stroke:var(--gold);stroke-width:6}
.kmap .rg:focus-visible{outline:none;stroke:var(--ring);stroke-width:6}
.kmap .rg.isle{fill:var(--land);cursor:default}
.kmap .labels{pointer-events:none}
.kmap .ml text{font:800 40px var(--font);text-anchor:middle;fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:8px;stroke-linejoin:round}
.kmap .ml .sub{font-size:30px;font-weight:700}
.kmap .ml.sm text{font-size:29px;stroke-width:7px} .kmap .ml.sm .sub{font-size:23px}
.kmap .inset{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
.kmap .ml-isle{font:600 13px var(--font);text-anchor:middle;fill:var(--muted)}
.kmap .mk{stroke:var(--surface);stroke-width:2}

.lawpage{max-width:780px;padding:40px 52px 32px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px 14px 14px 4px;box-shadow:inset 8px 0 0 var(--spine),0 10px 30px -18px rgba(0,0,0,.45);
  font:16.5px/1.85 "Noto Serif KR","Nanum Myeongjo","나눔명조","Batang","바탕","AppleMyungjo",serif;word-break:keep-all}
.lawhead{text-align:center;padding-bottom:22px;border-bottom:3px double var(--rule)}
.lawkicker{font-size:12.5px;letter-spacing:.3em;color:var(--ink2)}
.lawhead h2{font-size:26px;font-weight:700;margin:6px 0 10px;letter-spacing:.02em}
.lawhead p{margin:0 auto;max-width:34em;font-size:14px;color:var(--ink2)}
.lawch{scroll-margin-top:calc(var(--top-h,58px) + 16px);padding-top:26px}
.lawch h3{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:12px;font-size:21px;font-weight:700}
.lawch h3 span{font-size:12.5px;font-weight:400;letter-spacing:.25em;color:var(--ink2)}
.art{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:18px;padding:12px 0;border-bottom:1px dotted var(--rule)}
.artno{font-weight:700}
.art p{margin:0}
.lawfoot{margin-top:26px;text-align:center;font-size:13px;letter-spacing:.4em;color:var(--ink2)}
@media (max-width:900px){.lawbook{grid-template-columns:1fr}.lawtoc{position:static}.lawtoc ol{flex-direction:row;flex-wrap:wrap}.lawtoc a{gap:8px}}
@media (max-width:600px){.lawpage{padding:26px 18px 22px 24px;font-size:15.5px}.art{grid-template-columns:1fr;gap:2px}}
.mapbox{position:relative}
.mapctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.mapctl .ib{min-width:40px;height:40px;font-size:18px;font-weight:800;box-shadow:var(--shadow)}
.mapctl [data-zoom="reset"]{font-size:12.5px}
.kmap.zoomed{touch-action:none;cursor:grab}
.kmap.zoomed:active{cursor:grabbing}
.mapnote{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.mapnote .grad{display:inline-block;width:90px;height:10px;border-radius:99px;vertical-align:-1px;margin:0 6px;border:1px solid var(--border)}
/* 인물 초상 */
.face{flex:none;border-radius:14px;box-shadow:0 2px 6px rgba(2,6,23,.22)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{min-width:0}
/* 인재 카드 */
.pcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.psort{gap:4px;margin:0 0 14px}.psort .btn{min-height:28px;padding:2px 9px;font-size:12px;border-radius:7px}
.pcard{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.pcard .who h3{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pstat{display:grid;grid-template-columns:auto 1fr 28px;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.pstat b{text-align:right;color:var(--fg)}
/* 교섭 인물 사진: 누르면 능력치 팝업 */
.facebtn{display:inline-flex;flex:none;padding:0;border:0;background:none;border-radius:10px;cursor:pointer;transition:transform .1s}
.facebtn:hover{transform:scale(1.06)}
.facebtn:focus-visible{outline:2px solid var(--primary2);outline-offset:2px}
.pstat .bar{height:7px}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;font-size:12.5px}
.leader{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.leader .face{border-radius:18px}

const { REGIONS: R, LAW } = L;

const BASE_SCHED = L.schedule(40);
let SCHED = BASE_SCHED;

// 총선과 지방선거는 1년씩 엇갈리고, 대선은 총선 반년 뒤. tempoFrom(빠른 일정 시작일, 새 게임은 0) 전에 치른 선거는 실제 일정 그대로 둠
const GAP = { nat: 730, gov: 730, pres: 1095 };
const wedOn = d => L.electionDay(L.dayToDate(d), 0); // 그날 이후 첫 수요일(공휴일 앞뒤면 다음 주, 공직선거법 제34조)
function rebuildSched(o) {
  const a = o.tempoFrom ?? 0, past = BASE_SCHED.filter(e => e.day < a), cnt = t => past.filter(e => e.type === t).length;
  const nat1 = o.natDay ?? a + 365; // 옛 저장 파일은 앞당긴 총선(D-140)부터
  // 옛 저장 파일의 앞당긴 총선은 정한 날(D-140) 그대로, 나머지는 수요일로 맞춤
  const series = (type, first, n0, name) => Array.from({ length: 25 }, (_, i) => type === 'nat' && i === 0 && o.natDay != null ? first : wedOn(first + i * GAP[type])).filter(d => d >= a)
    .map((day, i) => ({ type, name: name(n0 + i), day, key: type + day }));
  let out = [...past,
    ...series('nat', nat1, 23 + cnt('nat'), n => `제${n}대 국회의원선거`),
    ...series('gov', nat1 + 365, 9 + cnt('gov'), n => `제${n}회 전국동시지방선거`),
    ...series('pres', nat1 + 182, 23 + cnt('pres'), n => `제${n}대 대통령선거`)];
  // 대통령 궐위 → 60일 안에 보궐 대선(헌법 제68조). 새 임기가 시작되므로 이후 대선도 그날부터 3년마다
  for (const d of o.presEarly || []) {
    const n = 23 + out.filter(e => e.type === 'pres' && e.day < d).length;
    const pres = [{ type: 'pres', name: `제${n}대 대통령선거 (궐위)`, day: d, key: 'pres' + d },
      ...Array.from({ length: 12 }, (_, i) => wedOn(d + (i + 1) * GAP.pres)).map((day, i) => ({ type: 'pres', name: `제${n + i + 1}대 대통령선거`, day, key: 'pres' + day }))];
    out = [...out.filter(e => e.type !== 'pres' || e.day < d), ...pres];
  }
  SCHED = out.sort((x, y) => x.day - y.day);
}

  ctx: null, sfxG: null, bus: null, timer: null, step: 0, t: 0, ci: 0, ct: 0,
  saveSet() { try { localStorage.setItem(SET_KEY, JSON.stringify(this.set)); } catch (e) { } },
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    this.sfxG = this.ctx.createGain(); this.sfxG.connect(this.ctx.destination);
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
    const comp = this.ctx.createDynamicsCompressor(); lp.connect(comp); comp.connect(this.ctx.destination); // 음량을 키워도 찢어지지 않게
    this.bus = this.ctx.createGain(); this.bus.connect(lp);
    this.applyVol();
    return true;
  },
  note(dest, f, t, dur, type = 'sine', g = 0.1, atk = 0.01) {
    const o = this.ctx.createOscillator(), a = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + atk); a.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      [66, 1.5], [67, .5], [69, 1], [66, 1], [71, 1.5], [72, .5], [74, 1], [71, 1], [69, 1], [67, 1], [66, 1], [67, 1], [69, 3], [0, 1], ...v];

  bgm(on) {
    clearInterval(this.timer); this.timer = null;
    if (!on || !this.ensure()) return;
    const q = 60 / 72, hz = m => 440 * 2 ** ((m - 69) / 12);
    this.t = this.ct = this.ctx.currentTime + 0.1; this.step = this.ci = 0;
    this.timer = setInterval(() => {
      const end = this.ctx.currentTime + 0.6;
      while (this.ct < end) {
        const [r, ...ch] = this.CHN[this.CH[this.ci++ % this.CH.length]];
        ch.forEach(m => this.note(this.bus, hz(m), this.ct, q * 2.2, 'triangle', 0.025, 0.4));
        this.note(this.bus, hz(r), this.ct, q * 1.8, 'sine', 0.07, 0.05);
        this.ct += q * 2;
      }
      while (this.t < end) {
        const [m, d] = this.MEL[this.step++ % this.MEL.length];
        if (m) this.note(this.bus, hz(m), this.t, d * q * 0.95, 'triangle', 0.06, 0.04);

  applyVol() { if (!this.ctx) return; this.sfxG.gain.value = 3 * this.set.sfxVol; this.bus.gain.value = 0.55 * 15 * this.set.bgmVol; },

const genRec = (integ, noBan) => {

// ---------- 시간 흐름 ----------
function daily() {
  const seats = seatTotal('P');
  const floor = 2 + seats / 4 + govCount('P') * 2 + (S.president.party === 'P' ? 35 : 0);
  S.fame = clamp(Math.max(S.fame - S.fame * 0.003, floor), 0, 100);
  for (const r of R) S.rtrust[r.k] += (50 - S.rtrust[r.k]) * 0.002;
  S.buzz *= 0.97;
  const honey = S.president.party === 'P' ? Math.max(0, 6 - (S.day - S.president.since) / 120) : 0;
  const target = (S.fame / 100) * (0.25 + 0.75 * S.trust / 100) * 40 + seats / 300 * 8 + S.buzz + honey + Math.min(3, S.laws.length * 0.3);
  // 밸런스: 목표치로 따라가는 속도를 오를 땐 SUP_UP배, 내릴 땐 SUP_DOWN배. 화제성(buzz)은 매일 식으므로 일시적 호재는 덜 오르고 악재는 더 깊게 반영됨
  const SUP_UP = 0.6, SUP_DOWN = 1.5;

  // 지역 지지율은 그 지역 목표치(전국 지지율 × 지역 배율)를 따라감. 신뢰도 낮은 지역은 덜 오르고 더 떨어지며, 높은 지역은 덜 떨어짐
  for (const r of R) {

    S.rsup[r.k] = cur + (t - cur) * 0.05 * (t > cur ? lowTrust(tr) : trustFall(tr));

// ---------- 의회: 법안 발의 → 상임위 → 본회의 → 정부 이송(거부권) ----------
// 법안·정책으로 바뀐 제도의 배율(후원금·보조금·수사)
const fxMul = k => S.fx.filter(f => f.k === k && f.until > S.day).reduce((m, f) => m * f.m, 1);
function billAgree(b, id) {
  if (b.by) { // 다른 당·정부 법안: 노선·여론·여야 구도로 찬반. 우리 표는 당론(stance)대로
    if (id === b.by) return 0.95;
    if (id === 'P' && b.stance) return b.stance > 0 ? 1 : 0;
    const ide = id === 'P' ? S.party.ideo : RIV[id].ideo;
    let a = 0.6 - 0.35 * Math.abs(ide - b.side) + (b.pop - 0.5) * 0.6 + (id === 'P' ? 0 : b.lobby);
    if (b.gov) a -= 0.1; else if (S.president.party === id) a -= 0.12;
    return clamp(a, 0.03, 0.95);

  if (S.president.party === id) a -= 0.12; // 여당은 다른 당 법안에 소극적

}
// 의결 정족수는 정원(300)이 아니라 재적의원(지금 의석을 가진 의원 수) 기준. 표결엔 모두 출석한다고 봄
// 일반 의결: 재적 과반 출석·출석 과반 찬성(헌법 제49조) · 거부권 재의결: 출석 3분의 2 이상(제53조④) · 대통령 탄핵소추: 재적 3분의 2 이상(제65조②)
const seatsNow = () => sum(Object.keys(S.seats).map(seatTotal));
const passNeed = () => Math.floor(seatsNow() / 2) + 1, twoThirds = () => Math.ceil(seatsNow() * 2 / 3);
const billYes = b => sum(['P', 'A', 'B', 'C', 'O'].map(id => seatTotal(id) * billAgree(b, id)));

function billStep() {

    const pr = S.president.party;

      if (y < twoThirds()) { S.fame += 1; notes.push(`'${b.t}' 본회의 통과했으나 대통령 재의요구(거부권)로 폐기`); return false; }

// 다른 당 의원·정부도 법안을 낸다
function rivalBill(notes) {

// 다른 당·정부 법안 본회의: 우리 당론은 신뢰(여론과 맞는지)와 발의 당과의 관계에, 통과되면 제도가 바뀜

// 폴더 핸들은 IndexedDB에 둬서 다음에 열면 권한만 다시 받음(턴 종료 누를 때)
let saveDir = null;
const SAVE_MAX = 20;
const kv = (mode, fn) => new Promise((ok, no) => {
  const r = indexedDB.open('party-tycoon', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onerror = () => no(r.error);
  r.onsuccess = () => { const q = fn(r.result.transaction('kv', mode).objectStore('kv')); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); };
});
if (window.indexedDB) kv('readonly', s => s.get('saveDir')).then(h => saveDir = h || null).catch(() => { });
async function pickSaveDir() {

    let d = await showDirectoryPicker({ id: 'save', mode: 'readwrite' });
    if (d.name !== 'save') d = await d.getDirectoryHandle('save', { create: true });
    saveDir = d; await kv('readwrite', s => s.put(d, 'saveDir')); await saveToDir();
    toast(`'${d.name}' 폴더에 매 턴 자동 저장합니다.`, 'ok'); settingsModal();
  } catch (e) { if (e.name !== 'AbortError') toast('그 폴더에는 저장할 수 없습니다.', 'bad'); }

async function saveToDir() {
  if (!saveDir || !S) return;
  try {
    if (await saveDir.queryPermission({ mode: 'readwrite' }) !== 'granted') return;
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const name = `정당키우기_${S.party.name}_${fdate(S.day).slice(0, 10)}_${stamp}.json`.replace(/[\\/:*?"<>|]/g, '_');
    const w = await (await saveDir.getFileHandle(name, { create: true })).createWritable();
    await w.write(JSON.stringify(S)); await w.close();
    // 세이브 파일은 최대 SAVE_MAX개, 넘치면 가장 오래된 것부터 삭제
    const files = [];
    for await (const [n, h] of saveDir.entries()) if (h.kind === 'file' && n.startsWith('정당키우기_') && n.endsWith('.json')) files.push({ n, t: (await h.getFile()).lastModified });
    files.sort((a, b) => a.t - b.t);
    for (const f of files.slice(0, Math.max(0, files.length - SAVE_MAX))) await saveDir.removeEntry(f.n);
  } catch (e) { toast('폴더 자동 저장 실패. 설정에서 폴더를 다시 고르세요.', 'bad'); }
}

// 설명 문구(p.tip)는 가까운 제목 옆 (i) 버튼 안으로 옮김. 마우스를 올리거나 포커스(터치)하면 보임
// 문단(p·li)의 문장마다 .sent로 감쌈. 안쪽 태그(<b> 등)는 통째로 앞 문장에 붙고, 문장이 하나뿐이거나 블록 자식이 있으면 그대로 둠
function sentWrap(root) {
  for (const el of root.querySelectorAll('p, li')) {
    if (el.querySelector('p, li, ul, ol, div, table, button, input, select, label')) continue;
    const groups = [[]];
    for (const n of [...el.childNodes]) {
      if (n.nodeType !== 3) { groups.at(-1).push(n); continue; }
      const parts = n.textContent.split(/(?<=[.?!])\s+(?=\S)/);
      parts.forEach((t, i) => { if (i) groups.push([]); groups.at(-1).push(document.createTextNode(t)); });
    }
    if (groups.length < 2) continue;
    el.replaceChildren(...groups.flatMap((g, i) => { const sp = document.createElement('span'); sp.className = 'sent'; sp.append(...g); return i ? [' ', sp] : [sp]; }));
  }
}
function tipify(root) {

  const xl = [0, h.length - 1].map(i => { const t = L.dayToDate(h[i].d); return `<text x="${X(i)}" y="${H - 6}" text-anchor="${i ? 'end' : 'start'}" font-size="11" fill="var(--muted)">${t.getUTCFullYear()}.${t.getUTCMonth() + 1}</text>`; }).join('');

// 법령집: 법률별 편(헌법·정당법…)으로 묶고 조문 번호 순. 왼쪽 목차, 오른쪽 책 지면
function pLaw() {
  const chs = [];
  for (const [t, d] of LAWS) {
    const name = t.slice(0, t.indexOf(' 제')), no = t.slice(name.length + 1);
    let ch = chs.find(c => c.name === name); if (!ch) chs.push(ch = { name, arts: [] });
    ch.arts.push({ no, d, n: parseInt(no.slice(1)) });
  }
  chs.forEach(c => c.arts.sort((a, b) => a.n - b.n));
  return `<div class="lawbook">
    <div class="lawtoc" role="navigation" aria-label="법령 목차"><b>목차</b><ol>${chs.map((c, i) => `<li><a href="#lawch-${i}">${c.name}<span class="num">${c.arts.length}</span></a></li>`).join('')}</ol></div>
    <article class="lawpage">
      <header class="lawhead"><div class="lawkicker">정당 키우기 · 법령집</div><h2>게임에 반영된 법령</h2>
        <p>2026년 기준 현행법을 게임용으로 요약했습니다. 일부 수치(선거권자 수, 보조금 계상단가, 선거비용제한액, 지역 성향)는 근사치이며 실제 조문과 다를 수 있습니다.</p></header>
      ${chs.map((c, i) => `<section class="lawch" id="lawch-${i}"><h3><span>제${i + 1}편</span>${c.name}</h3>
        ${c.arts.map(a => `<div class="art"><div class="artno">${a.no}</div><p>${a.d}</p></div>`).join('')}</section>`).join('')}
      <footer class="lawfoot">끝</footer>
    </article></div>`;
}
// 소식: 턴별로 브리핑·헤드라인·국회·청와대·지방 정부 동향·우리 당 기록을 모아 봄
let feedF = 'all', feedN = 12;
const FEED_F = [['all', '전체'], ['news', '헤드라인'], ...Object.entries(WIRE_C), ['mine', '우리 당 기록']];
function pLog() {
  const wk = d => Math.floor(d / TURN) + 1, cur = turnNo(), W = {}, get = k => (W[k] ??= { k, logs: [], wire: [] });
  get(cur);
  for (const b of S.briefs) get(wk(b.d)).b = b;
  for (const l of S.log) get(wk(l.d)).logs.push(l);
  for (const x of S.wire) get(wk(x.d)).wire.push(x);
  const on = f => feedF === 'all' || feedF === f, timed = (ls, cls) => `<ul class="log">${[...ls].reverse().map(l => `<li class="${cls ? l.c : ''}"><time>${fdate(l.d)}</time><span>${esc(l.t)}</span></li>`).join('')}</ul>`;
  const card = w => {
    const b = w.b, news = b ? b.news : w.k === cur ? S.news : [], parts = [];
    if (feedF === 'all' && b) parts.push(briefPills(b));
    if (on('news') && news.length) parts.push(`<h3 style="margin-top:12px">헤드라인</h3>${newsList(news)}`);
    for (const [c, n] of Object.entries(WIRE_C)) { // 법안 진행(b.notes)은 국회 소식
      const ws = w.wire.filter(x => x.c === c), ns = c === 'hall' && b ? b.notes : [];
      if (on(c) && (ws.length || ns.length)) parts.push(`<h3 style="margin-top:12px">${n} 소식</h3>${ns.length ? noteList(ns) : ''}${ws.length ? timed(ws) : ''}`);
    }
    if (on('mine') && w.logs.length) parts.push(`<h3 style="margin-top:12px">우리 당 기록</h3>${timed(w.logs, true)}`);
    return parts.length ? `<section class="card" style="margin-top:14px"><h2>${w.k}턴 <span class="small muted">${fdate((w.k - 1) * TURN)}</span>${w.k === cur ? ' <span class="pill">이번 턴</span>' : ''}</h2>${parts.join('')}</section>` : '';
  };
  const cards = Object.values(W).sort((a, b) => b.k - a.k).map(card).filter(Boolean);
  return `<div class="card"><h2>소식</h2><p class="tip">턴마다 브리핑, 헤드라인, 국회·청와대·지방 정부 소식, 우리 당 기록을 모았습니다. 지방 정부에는 직접·자동화로 펼친 행정 사업과 후속 보도, 단체장 직무 평가가 모입니다. 지난 헤드라인을 이어 보면 민심의 흐름이 보입니다.</p>
    <div class="filters" role="group" aria-label="소식 분류">${FEED_F.map(([k, n]) => `<button class="btn${feedF === k ? ' pri' : ''}" data-feed="${k}" aria-pressed="${feedF === k}">${n}</button>`).join('')}</div></div>
    ${cards.slice(0, feedN).join('') || '<div class="card" style="margin-top:14px"><p class="empty">아직 소식이 없습니다.</p></div>'}
    ${cards.length > feedN ? `<button class="btn" data-feedmore="1" style="margin-top:14px;width:100%">이전 소식 더 보기 (${cards.length - feedN}턴 남음)</button>` : ''}`;
}

    ${sec('사건과 제안', `<ul><li>당장 이득이 되는 달콤한 제안이 들어옵니다. 받을지 말지는 스스로 판단하세요. 받은 일은 재정 탭 '숨긴 일'에 남습니다.</li>
      <li>숨긴 일은 영영 묻힐 수도, 어느 날 드러날 수도 있습니다. 시간이 지날수록 흐려지지만 당이 클수록 보는 눈이 많아지고, 국정감사·경쟁 정당의 고발·탈당자의 제보로 터지기도 합니다.</li>
      <li>영입 인재는 청렴도가 낮을수록 스캔들이 잘 터집니다.</li>
      <li>워크숍, 봉사, 간담회, 중재안처럼 무난해 보이는 대안도 늘 통하지는 않습니다. 대표 역량이 높을수록 잘 풀리지만, "보여주기"나 공개 충돌로 역풍을 맞을 수도 있습니다.</li></ul>`)}
    ${sec('여론의 출렁임', `<ul><li>지지율은 꾸준히 오르기만 하지 않습니다. 사소한 일이 크게 번지기도 합니다.</li>
      <li>지역 소식 중 일부는 '화제'가 되어, 그 지역 단체장 소속 정당(우리 당이나 다른 당)의 지지율을 흔듭니다. 미담은 호재, 현안·사고는 악재입니다.</li>
      <li>우리 당 소속 국회의원·광역단체장은 지도부와 상의 없이 스스로 발언하고 움직입니다. 역량·청렴도가 높을수록 호평받을 일을 하고, 실수하면 상대 당이 사퇴 공세를 펴 지지율이 크게 빠집니다. 사과·감싸기·징계·맞불 중 대응을 고릅니다.</li>
      <li>짜깁기 영상, 동명이인 오보, 과장 보도, 음모론처럼 근거가 약한 공세('억까')도 일단 퍼지면 지지율이 빠집니다. 정면 반박·고소·유머로 받아치기는 통하면 만회하지만 실패하면 더 번집니다.</li></ul>`)}
    ${sec('사회적 이슈', `<ul><li>미투 운동, 군 장병 사망사고, 전세사기, 산재 사망 같은 사회적 사건이 터지면 몇 주 동안 정국을 덮습니다. 화면 맨 위 배너와 국회 탭에 표시됩니다.</li>
      <li>각 당이 입장을 내고, 우리도 입장을 고릅니다. 법안형 입장은 의석이 있으면 바로 발의되고, 정부 책임을 묻는 입장은 대통령 쪽 당과의 관계를 해칩니다.</li>
      <li>사건이 잦아들 무렵 여론이 입장별로 갈립니다. 여론과 맞는 입장을 낸 당은 신뢰·지지를 얻고, 엇갈린 당은 역풍을 맞습니다. 끝내 입장을 내지 않으면 "침묵했다"는 비판을 받습니다.</li>
      <li>사건마다 한 번 현장 방문·유가족 면담을 할 수 있습니다. 진정성으로 읽힐 수도, 사진 찍기로 읽힐 수도 있습니다.</li></ul>`)}
    ${sec('수사와 재판', `<ul><li>의혹이 드러나거나 고발당하면 검찰 수사 → 기소 여부 결정 → 1심 판결 순으로 몇 달에 걸쳐 진행됩니다. 결백해도 고발은 당할 수 있습니다.</li>
      <li>단계마다 대응을 고릅니다. 성실한 조사, 변호인단 선임, "정치 탄압" 프레임, 증거 정리 같은 선택마다 기소·유죄 가능성과 여론이 달라집니다.</li>
      <li>유죄가 나오면 벌금·추징, 신뢰 하락, 의원직이나 단체장 직 상실이 따를 수 있습니다.</li>
      <li>우리도 가짜뉴스 유포자나 경쟁 정당을 고소·고발할 수 있습니다. 무리한 고발은 역풍을 맞습니다.</li></ul>`)}
    ${sec('교섭', `<ul><li>정식 정당이 되면 교섭 탭에서 다른 정당, 원내 의원, 원외 인사와 교섭할 수 있습니다. 한 번에 행동력 1과 경비가 들고, 같은 상대와는 2턴에 한 번입니다.</li>
      <li>정당과는 대표 회동, 법안 공조 협약(6개월간 우리 법안에 우호적), 선거 연대(우리 후보가 나간 곳엔 후보를 내지 않음)를 맺을 수 있습니다.</li>
      <li>원내 의원(각 당·무소속)과는 친분 쌓기, 법안 협조 요청, 입당(이적) 제안을 할 수 있습니다. 지역구 의원이 넘어오면 그 의석이 우리 당 것이 됩니다.</li>
      <li>원내 의원과 원외 인사는 좌우로 나란히 봅니다. 별 버튼을 켠 정당은 정당 목록 맨 왼쪽, 의원·원외 인사는 각 목록 맨 위로 올라옵니다.</li>
      <li>원외 인사(전직 의원·장관·단체장, 당협위원장, 시민사회·노동계 인사, 정치 유튜버 등)에게는 지지 선언을 요청하거나 영입을 제안할 수 있습니다. 이름값이 클수록 효과도 크지만 설득하기 어렵습니다. 총선에서 물러난 의원 일부는 원외 인사로 남습니다.</li>
      <li>성공 가능성은 <b>대표의 역량</b>, <b>상대와의 노선 차이</b>, <b>그동안의 관계</b>로 정해집니다. 규탄·고발·국감 공세·탄핵 표결 같은 일은 관계에 기록되어 나중의 교섭과 법안 표결, 거부권에 영향을 줍니다. 교섭에 성공할수록 대표의 역량도 오릅니다.</li></ul>`)}
    ${sec('탄핵과 조기 대선', `<ul><li>대통령 쪽 지지율이 크게 떨어지면 탄핵소추안이 발의될 수 있습니다. 재적의원 3분의 2 이상이 찬성하면 헌법재판소 심판으로 넘어갑니다.</li>
      <li>헌법재판소가 파면을 결정하면 권한대행 체제가 되고 약 두 달 뒤 조기 대선이 열립니다. 공천 기간이 짧아 미리 대선 후보감(만 ${LAW.age.pres}세 이상)을 준비해 둬야 합니다.</li>
      <li>조기 대선 뒤에는 그날부터 다시 3년마다 대선이 열립니다.</li></ul>`)}
    ${sec('의회·행정 활동', `<ul><li>국회 의석이 생기면 국회 탭에서 법안을 발의하고 대정부 질문을 할 수 있습니다. 법안은 상임위와 본회의(재적 과반 찬성)를 거치고, 대통령 쪽 당이 반대하면 거부권에 막힐 수 있습니다.</li>
      <li>매년 10월 국정감사, 12월 예산안 심사에서 어떤 태도를 취할지 고릅니다. 정부 견제와 탄핵소추, 인사청문회 같은 일도 생깁니다.</li>
      <li>광역단체장을 배출하면 지방 정부 탭에서 그 지역 역점사업을 펼칩니다. 행정 지지도는 지역 지지율과 재선 가능성에 반영됩니다.</li>
      <li>역점사업은 일반 행동력과 별도인 <b>행정 행동력</b>을 씁니다. 우리 당 단체장이 1명이면 1, 2명마다 1씩 늘고(2~3명 2, 4~5명 3), 행동력을 한 지역에 몰아 써도 됩니다. 다만 같은 지역의 같은 사업은 한 턴에 한 번입니다. 그 지역 단체장 역량이 높을수록 사업 성공률이 오릅니다.</li>
      <li>'행정 운영' 제목 오른쪽의 <b>자동화</b>를 켜면, 턴을 끝낼 때 남은 행정 행동력으로 현안 지정과 맞는 역점사업을 알아서 진행합니다. 진짜 지역 문제를 가려내는 정확도는 그 지역 단체장 역량에 달려 있습니다.</li>
      <li>지방 정부 탭에서는 시·도별 지역 소식(지역 현안, 동네 사건, 재난, 선거 결과)을 지역을 골라 볼 수 있습니다. 행정 사업 결과·후속 보도·단체장 직무 평가는 소식 탭의 '지방 정부'에 모입니다. 시·군·구 단위의 동네 사건부터 지역 전체의 큰 흐름까지 매주 보도됩니다.</li>
      <li>어떤 소식을 <b>지역 현안</b>으로 볼지는 직접 정합니다. 지역 소식 옆 '현안 지정'을 누르면 지방 정부 탭 '지역 현안'에 담깁니다(지역당 ${desMax}건, 5주 유지). 다만 그 소식이 진짜 지역 문제인지는 알 수 없습니다.</li>
      <li>제대로 짚은 현안에 맞는 역점사업으로 대응하면 성공률·효과가 오르고 문제가 풀립니다. 헛짚으면 보탬이 없고, 시·도당 현장 대응도 잘 안 먹힙니다. 드러나지 않은 악재가 사업 성공률을 깎기도 합니다.</li>
      <li>지정하지 않았더라도 진짜 문제를 5턴 넘게 방치하면 그 지역 지사가 책임론에 시달립니다.</li>
      <li>역점사업 몇 주 뒤에는 후속 보도가 나옵니다. 성과 소식뿐 아니라 소음 민원·투기 우려처럼 새 현안이 생기기도 합니다.</li>
      <li>우리 시·도당이 있는 지역의 지정 현안에는 '시·도당 대응'(행정 행동력 1·300만, 우리 당 단체장이 없으면 행동력 1)으로 현장에 나설 수 있습니다. 호응을 얻으면 그 지역 당원이 늘고, 실패하면 눈총을 받습니다.</li>
      <li>선거운동기간, 후보 등록 마감, 탄핵심판, 국정감사 같은 큰 일정은 화면 맨 위 배너에 뜹니다. 누르면 관련 탭으로 갑니다.</li></ul>`)}
    ${sec('다른 당과 정부의 움직임', `<ul><li>다른 당 의원과 정부도 법안을 냅니다. 발의 소식과 여론조사는 주간 브리핑의 국회 소식에 나옵니다.</li>
      <li>의석이 있으면 법안마다 당론(찬성·반대·자유투표)을 정하고, 표 단속으로 다른 당 표를 움직일 수 있습니다. 여론과 맞는 당론은 신뢰를 올리고, 발의한 당과의 관계는 찬반에 따라 바뀝니다. 우리 표로 결과가 갈리면 캐스팅보트로 주목받습니다.</li>
      <li>후원 한도, 보조금 배분, 검찰 수사권처럼 우리 당에 직접 영향을 주는 법안도 있습니다. 통과되면 '바뀐 제도'에 표시됩니다.</li>
      <li>대통령도 수시로 정책을 발표합니다. 환영·비판·장외 집회 중 입장을 고르면 몇 주 뒤 여론조사로 판정이 나고, 여론과 맞았는지에 따라 신뢰가 오르내립니다. 정책 발표는 그달의 쟁점도 바꿉니다.</li>
      <li>우리 당이 집권하면, 반대 당론을 정한 법안이 재적 3분의 2 미만으로 통과될 때 대통령이 거부권을 행사합니다.</li>
      <li>다른 당 광역단체장도 역점사업을 펼칩니다. 협조·견제·관망 중 입장을 고르면 몇 주 뒤 사업 성패에 따라 평가가 갈립니다. 지사 행정 지지도는 그 지역 선거에서 그 당의 득표에 반영됩니다.</li>
      <li>다른 당 지사가 우리 당 지사에게 공동사업을 제안하거나, 측근 비리 의혹이 터져 고발 여부를 정해야 할 때도 있습니다.</li></ul>`)}
    ${sec('게임 오버 조건', `<ul><li>창당준비위원회 결성 후 ${LAW.prepDays}일 안에 정당 등록 실패</li>
      <li>등록 뒤 시·도당 요건(5곳, 각 1,000명)이 깨지고 90일 유예 안에 회복 실패</li>
      <li>4년간 국회의원선거·지방선거에 한 번도 참여하지 않음</li>
      <li>자금이 마이너스인 채로 120일 경과</li></ul>`)}
    ${sec('업적', `<ul class="check">${ACHS.map(([k, n]) => `<li><span class="st ${S.ach[k] ? 'done' : ''}">${S.ach[k] ? '✓' : ''}</span><div class="small">${n}${S.ach[k] ? ` <span class="muted">${fdate(S.ach[k])}</span>` : ''}</div></li>`).join('')}</ul>`)}
    ${sec('조작', `<ul><li>Space: 턴 종료</li><li>오른쪽 위 설정 버튼: 소리, 저장 파일 내보내기·불러오기, 새 게임</li><li>자동 저장은 매 턴이 끝날 때 됩니다. 크롬·엣지는 설정에서 고른 폴더의 save/에도 저장합니다.</li></ul>`)}
  </div>`;
}

// ---------- 설정 ----------
function settingsModal() {
  Snd.sfx('click');
  const s = Snd.set;
  openModal({
    title: '설정·저장', html: `
      <h3>소리</h3><p class="small muted">소리는 게임 진행에 필요하지 않습니다. 모든 정보는 화면에 표시됩니다.</p>
      <div class="row"><label class="small"><input type="checkbox" id="sBgm" ${s.bgm ? 'checked' : ''}> 배경음악</label><label class="small"><input type="checkbox" id="sSfx" ${s.sfx ? 'checked' : ''}> 효과음</label>
      <label class="f">배경음악 음량<input type="range" id="sBgmVol" min="0" max="1" step="0.05" value="${s.bgmVol}"></label><label class="f">효과음 음량<input type="range" id="sSfxVol" min="0" max="1" step="0.05" value="${s.sfxVol}"></label></div>
      <h3 style="margin-top:16px">턴 종료 확인</h3><p class="small muted">행동력이 남은 채 턴을 종료하려 하면 한 번 더 묻습니다.</p>
      <div class="row"><label class="small"><input type="checkbox" id="sConfAp" ${s.confAp ? 'checked' : ''}> 행동력(의회·당 활동)이 남았을 때</label><label class="small"><input type="checkbox" id="sConfAap" ${s.confAap ? 'checked' : ''}> 행정 행동력이 남았을 때</label></div>
      <h3 style="margin-top:16px">실행 확인</h3><p class="small muted">활동·인재 영입·표 단속 등을 누르면 비용과 행동력을 한 번 더 보여 줍니다.</p>
      <div class="row"><label class="small"><input type="checkbox" id="sCost" ${s.skipCost ? '' : 'checked'}> 비용·행동력 확인 창 보기</label></div>
      <h3 style="margin-top:16px">저장</h3><p class="small muted">매 턴이 끝날 때, 창을 닫거나 내릴 때 이 브라우저에 자동 저장됩니다. 브라우저 데이터를 지우면 사라지므로 가끔 파일로 내보내 두세요.</p>
      <div class="btns"><button class="btn" id="sExp">파일로 내보내기</button><button class="btn" id="sImp">파일 불러오기</button><button class="btn danger" id="sNew">새 게임</button></div>
      <p class="small muted" style="margin-top:8px">${!window.showDirectoryPicker ? '폴더 자동 저장은 크롬·엣지에서만 됩니다.' : saveDir ? `폴더 자동 저장 중: <b>${esc(saveDir.name)}</b>/정당키우기_${esc(S.party.name)}_날짜_시각.json (매 턴 새 파일, 최근 ${SAVE_MAX}개만 남김, 불러오기는 '파일 불러오기'로)` : '폴더를 고르면 그 안의 save 폴더에 매 턴 자동 저장합니다.'}</p>
      ${window.showDirectoryPicker ? `<div class="btns"><button class="btn" id="sDir">${saveDir ? '저장 폴더 바꾸기' : '저장 폴더 고르기'}</button></div>` : ''}
      <h3 style="margin-top:16px">단축키</h3><p class="small muted">Space 턴 종료</p>`,
    buttons: [{ t: '닫기', pri: true }],
    onOpen: m => {
      m.querySelector('#sBgm').onchange = e => { s.bgm = e.target.checked; Snd.saveSet(); Snd.bgm(s.bgm); };
      m.querySelector('#sSfx').onchange = e => { s.sfx = e.target.checked; Snd.saveSet(); Snd.sfx('click'); };
      m.querySelector('#sBgmVol').oninput = e => Snd.vol('bgmVol', +e.target.value);
      m.querySelector('#sSfxVol').oninput = e => Snd.vol('sfxVol', +e.target.value);
      m.querySelector('#sSfxVol').onchange = () => Snd.sfx('click');
      m.querySelector('#sConfAp').onchange = e => { s.confAp = e.target.checked; Snd.saveSet(); };
      m.querySelector('#sConfAap').onchange = e => { s.confAap = e.target.checked; Snd.saveSet(); };
      m.querySelector('#sCost').onchange = e => { s.skipCost = !e.target.checked; Snd.saveSet(); };
      m.querySelector('#sExp').onclick = exportSave;
      m.querySelector('#sImp').onclick = () => $('#importFile').click();
      if (m.querySelector('#sDir')) m.querySelector('#sDir').onclick = pickSaveDir;
      m.querySelector('#sNew').onclick = () => openModal({ title: '새 게임', html: '<p>현재 진행 상황을 지우고 새로 시작할까요? 필요하면 먼저 파일로 내보내세요.</p>', buttons: [{ t: '취소' }, { t: '새로 시작', pri: true, fn: newGameModal }] });
    },
  });
}
function newGameModal() {
  left = 0; turnStart = null;
  openModal({
    title: '정당 창당', dismiss: false, html: `
    <p class="muted small">발기인 200명과 함께 중앙당창당준비위원회를 결성합니다. 6개월 안에 5개 이상 시·도당(각 당원 1,000명)을 만들어 선관위에 등록하세요.</p>
    <form id="ng" style="display:flex;flex-direction:column;gap:12px">
      <label class="f">정당 이름 *<input type="text" name="name" maxlength="12" required value="새미래당" autocomplete="off"><span class="h" id="ngErr" role="alert"></span></label>
      <div class="f">정당 색<div class="swatches">${PCOLORS.map(([n, c], i) => `<label><input type="radio" name="color" value="${c}" ${i ? '' : 'checked'}><span style="background:${c}" title="${n}"></span><b class="sr">${n}</b></label>`).join('')}</div></div>
      <div class="row">
        <label class="f">노선<select name="ideo"><option value="1">진보</option><option value="0" selected>중도</option><option value="-1">보수</option></select></label>
        <label class="f">창당 본거지<select name="home">${R.map(r => `<option value="${r.k}" ${r.k === 'seoul' ? 'selected' : ''}>${r.n}</option>`).join('')}</select></label>
        <label class="f">난이도<select name="diff"><option value="easy">쉬움 (6억)</option><option value="normal" selected>보통 (3억)</option><option value="hard">어려움 (1.5억)</option></select></label>
      </div>
      <div class="row">
        <label class="f">당 대표 이름 *<input type="text" name="leader" maxlength="8" required value="${genName('M')}"></label>
        <label class="f">나이<input type="number" name="age" min="18" max="85" value="45"><span class="h">대선 출마는 40세 이상</span></label>
        <label class="f">성별<select name="gender"><option value="M">남</option><option value="F">여</option></select></label>
      </div>
      <label class="f">슬로건<input type="text" name="slogan" maxlength="30" placeholder="선택 사항"></label>
      <button class="btn pri" type="submit">창당준비위원회 결성 신고</button>
    </form>`,
    onOpen: m => {
      const f = m.querySelector('#ng');
      f.onsubmit = e => {
        e.preventDefault();
        const v = Object.fromEntries(new FormData(f));
        v.name = v.name.trim(); v.leader = v.leader.trim();
        const clash = Object.values(RIV).find(x => v.name.replace(/당$/, '') && (x.name.includes(v.name.replace(/당$/, '')) || v.name.includes(x.name.replace(/당$/, ''))));
        const err = !v.name ? '정당 이름을 입력하세요.' : clash ? `기존 등록 정당 '${clash.name}'과(와) 뚜렷이 구별되지 않습니다 (정당법 제41조).` : !v.leader ? '대표 이름을 입력하세요.' : '';
        if (err) { m.querySelector('#ngErr').textContent = err; m.querySelector('#ngErr').className = 'h bad'; Snd.sfx('bad'); return; }
        v.age = clamp(+v.age || 45, 18, 85);
        newState(v); save(); closeModal(); tab = 'guide'; renderAll(); Snd.sfx('ok');
        toast(`매 턴(1주) 행동력 ${AP}만큼 활동하고 '턴 종료'(Space)를 누르세요. 막히면 '가이드' 탭을 보세요.`);
      };
    },
  });
}

// ---------- 시작 ----------
(function boot() {
  // 상단바(배너 포함) 높이를 따라오는 칸의 기준으로
  new ResizeObserver(() => document.documentElement.style.setProperty('--top-h', $('#top').offsetHeight + 'px')).observe($('#top'));
  new ResizeObserver(markLead).observe($('#main'));
  S = loadSave();
  if (S) { renderAll(); openModal({ title: '정당 키우기', html: `<p><b>${esc(S.party.name)}</b> · ${fdate(S.day)} 저장 기록이 있습니다.</p>`, dismiss: false, buttons: [{ t: '새 게임', fn: newGameModal }, { t: '이어하기', pri: true }], onOpen: m => m.querySelector('[data-b="1"]').setAttribute('autofocus', '') /* 새로 고침하면 Enter로 바로 이어하기 */ }); if (S.over) gameOver(S.over.title, S.over.text); }
  else newGameModal();
})();
// 대선 단일화 제안 트리거(선거운동기간, 우리 후보가 앞설 때 한 번)
setInterval(() => {
  if (!S || modalOpen) return;
  for (const c of activeCamps()) if (c.type === 'pres' && c.rivals.C && !c.unified && !c.unifyAsked && S.support > poll().C) { c.unifyAsked = true; S.queue.push({ ev: 'unify', key: c.key }); }
}, 1000);
</script>
</body>
</html>
